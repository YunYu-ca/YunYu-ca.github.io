<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钓鱼乐园 · 第一人称 | FISHING PARADISE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b2a3d; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; }
  #cvs { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  /* ===== HUD ===== */
  #hud { position:absolute; top:12px; left:12px; display:flex; gap:10px; flex-wrap:wrap; z-index:10; pointer-events:none; }
  .chip { background:rgba(8,28,45,.72); color:#dff3ff; border:1px solid rgba(120,200,255,.35); border-radius:12px; padding:6px 12px; font-size:13px; backdrop-filter:blur(4px); box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .chip b { color:#ffd866; font-weight:700; }
  .chip .lb { color:#ff9d5c; font-weight:700; }

  #topBar { position:absolute; top:10px; right:12px; display:flex; gap:8px; z-index:12; }
  .btn { pointer-events:auto; background:rgba(8,28,45,.78); color:#e6f6ff; border:1px solid rgba(120,200,255,.4); border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; backdrop-filter:blur(4px); box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .btn:hover { background:rgba(20,50,75,.9); }
  .btn.primary { background:#2f7ea8; border-color:#5fb6e0; }
  .btn.danger { color:#ffc0b8; border-color:rgba(255,120,100,.5); }

  /* ===== 提示 ===== */
  #prompt { position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); z-index:11; color:#fff; font-size:26px; font-weight:800; text-align:center; text-shadow:0 2px 12px rgba(0,0,0,.8); pointer-events:none; opacity:0; transition:opacity .25s; letter-spacing:2px; }
  #prompt.show { opacity:1; }
  #subPrompt { position:absolute; top:46%; left:50%; transform:translate(-50%,0); z-index:11; color:#cdeeff; font-size:15px; text-align:center; text-shadow:0 1px 8px rgba(0,0,0,.8); pointer-events:none; opacity:0; transition:opacity .25s; }
  #subPrompt.show { opacity:1; }

  /* ===== 收线对抗条 ===== */
  #fight { position:absolute; left:50%; bottom:130px; transform:translateX(-50%); width:min(340px,80%); z-index:11; display:none; }
  #fight.show { display:block; }
  #fightLabel { color:#fff; font-size:13px; margin-bottom:5px; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #fightTrack { height:16px; border-radius:9px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.35); overflow:hidden; position:relative; }
  #fightFill { height:100%; width:0%; background:linear-gradient(90deg,#ff5a3c,#ffd866 50%,#4cd97b); border-radius:8px; transition:width .08s linear; }
  #fightMark { position:absolute; top:-3px; bottom:-3px; width:3px; background:#fff; box-shadow:0 0 6px #fff; left:50%; }

  /* ===== 排行榜 ===== */
  #leaderboard { position:absolute; top:56px; right:12px; width:250px; background:rgba(8,28,45,.82); border:1px solid rgba(120,200,255,.35); border-radius:14px; color:#e6f6ff; z-index:11; backdrop-filter:blur(6px); box-shadow:0 4px 20px rgba(0,0,0,.4); overflow:hidden; }
  #lbHead { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:rgba(0,0,0,.25); }
  #lbHead .t { font-weight:800; font-size:14px; }
  #lbLive { font-size:11px; color:#9fe8a0; }
  #lbLive.off { color:#ff9d9d; }
  #lbList { max-height:340px; overflow-y:auto; }
  .lb-row { display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; border-top:1px solid rgba(255,255,255,.06); }
  .lb-row .rk { width:22px; text-align:center; color:#9cc9e6; font-weight:700; }
  .lb-row.top .rk { color:#ffd866; }
  .lb-row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-row .sc { color:#ffd866; font-weight:700; }
  .lb-row.me { background:rgba(47,126,168,.35); }
  #lbEmpty { padding:16px; text-align:center; color:#9cc9e6; font-size:13px; }

  /* ===== 设置 ===== */
  #settingsOverlay { position:fixed; inset:0; background:rgba(4,16,26,.7); display:none; align-items:center; justify-content:center; z-index:50; }
  #settingsOverlay.show { display:flex; }
  #settingsBox { background:#0e3a52; color:#e6f6ff; border:1px solid rgba(120,200,255,.4); border-radius:16px; width:min(400px,90%); padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #settingsBox h2 { font-size:18px; margin-bottom:4px; }
  #settingsBox .sub { font-size:12px; color:#9cc9e6; margin-bottom:14px; }
  #settingsBox label { display:block; font-size:13px; margin:10px 0 4px; color:#cdeeff; }
  #settingsBox input { width:100%; padding:9px 11px; border-radius:8px; border:1px solid rgba(120,200,255,.4); background:rgba(0,0,0,.3); color:#fff; font-size:14px; }
  #settingsBox input:focus { outline:none; border-color:#5fb6e0; }
  #settingsBox .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  #settingsBox .row .btn { flex:1; min-width:100px; text-align:center; }
  #setNote { font-size:12px; color:#ffd866; margin-top:10px; min-height:16px; }
  #settingsBox .tip { font-size:11px; color:#8fb8d0; margin-top:10px; line-height:1.5; }

  #toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); background:rgba(8,28,45,.9); color:#dff3ff; border:1px solid rgba(120,200,255,.4); border-radius:10px; padding:9px 16px; font-size:14px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }

  /* ===== 移动端排行榜抽屉 ===== */
  @media (max-width:760px) {
    #leaderboard { top:auto; right:0; bottom:0; left:0; width:auto; border-radius:14px 14px 0 0; transform:translateY(calc(100% - 34px)); transition:transform .3s; }
    #leaderboard.open { transform:translateY(0); }
    #lbList { max-height:220px; }
    #lbHandle { display:block; text-align:center; color:#9cc9e6; font-size:12px; padding:2px; cursor:pointer; }
  }
  #lbHandle { display:none; }
  @media (min-width:761px) { #lbHandle { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cvs"></canvas>

  <div id="hud">
    <div class="chip">金币 <b id="hCoins">0</b></div>
    <div class="chip">得分 <b id="hScore">0</b></div>
    <div class="chip">最佳 <span class="lb" id="hBest">0</span></div>
    <div class="chip" id="hFishes">🐟 <b id="hCount">0</b> 条</div>
  </div>

  <div id="topBar">
    <button class="btn" id="btnSettings">⚙️ 设置</button>
    <button class="btn danger" id="btnExit">退出</button>
  </div>

  <div id="prompt"></div>
  <div id="subPrompt"></div>

  <div id="fight">
    <div id="fightLabel">保持拉力，别让鱼挣脱！</div>
    <div id="fightTrack"><div id="fightFill"></div><div id="fightMark"></div></div>
  </div>

  <div id="leaderboard">
    <div id="lbHandle" onclick="toggleLB()">▲ 实时排行榜（点此展开/收起）</div>
    <div id="lbHead">
      <span class="t">🏆 实时排行榜</span>
      <span id="lbLive">● 实时</span>
    </div>
    <div id="lbList"></div>
    <div id="lbEmpty" style="display:none;">暂无数据，配置 Token 后自动刷新</div>
  </div>

  <div id="settingsOverlay">
    <div id="settingsBox">
      <h2>⚙️ 游戏设置</h2>
      <div class="sub">配置玩家名与 GitHub Token，实现云端自动存档与排行榜</div>
      <label>玩家名（登录后自动使用，存档在 Game1Saves/）</label>
      <input id="inpUser" type="text" placeholder="例如 lh3778" autocomplete="off">
      <label>GitHub Token（需对该仓库有 Contents 读写权限）</label>
      <input id="inpToken" type="password" placeholder="ghp_xxxxxxxx" autocomplete="off">
      <div class="row">
        <button class="btn primary" onclick="saveSettings()">保存配置</button>
        <button class="btn" onclick="saveNow()">立即保存存档</button>
      </div>
      <div class="row">
        <button class="btn" onclick="loadCloud()">从云端恢复</button>
        <button class="btn" onclick="refreshLB()">刷新排行榜</button>
      </div>
      <div id="setNote"></div>
      <div class="tip">Token 仅保存在你浏览器本地（localStorage）。存档写入仓库 Game1Saves/玩家名.json，排行榜写入 Game1Data/leaderboard.json。</div>
      <div class="row"><button class="btn" onclick="closeSettings()">关闭</button></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<div id="g1-gate" style="position:fixed;inset:0;z-index:2147482900;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 480px at 18% -8%,rgba(120,200,255,.14),transparent 60%),radial-gradient(900px 420px at 92% 0,rgba(255,215,0,.12),transparent 55%),#04101c;font-family:system-ui;">
  <div style="width:min(360px,92vw);background:#0e3a52;border:1px solid rgba(120,200,255,.35);border-radius:16px;padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.6);">
    <div style="text-align:center;margin-bottom:18px;"><div style="font-size:40px;">🎣</div><div style="font-size:20px;font-weight:700;color:#e6f6ff;">钓鱼乐园</div><div style="color:#9cc9e6;font-size:12px;margin-top:4px;">注册账号才能游玩 · 退出自动询问保存 · 下次登录续玩</div></div>
    <div style="display:flex;margin-bottom:14px;background:rgba(0,0,0,.3);border-radius:8px;padding:4px;">
      <button id="g1-tab-login" style="flex:1;padding:8px;border:none;border-radius:6px;background:#2f7ea8;color:#fff;font-weight:600;cursor:pointer;">登录</button>
      <button id="g1-tab-reg" style="flex:1;padding:8px;border:none;border-radius:6px;background:transparent;color:#9cc9e6;cursor:pointer;">注册</button>
    </div>
    <input id="g1-un" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid rgba(120,200,255,.4);background:rgba(0,0,0,.3);color:#e6f6ff;margin-bottom:10px;" placeholder="玩家名（2-20 位，字母/数字/中文）">
    <input id="g1-pw" type="password" style="width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid rgba(120,200,255,.4);background:rgba(0,0,0,.3);color:#e6f6ff;margin-bottom:8px;" placeholder="密码（至少 4 位）">
    <button id="g1-go" style="width:100%;padding:11px;border:none;border-radius:8px;background:#ffd866;color:#04101c;font-weight:700;cursor:pointer;font-size:15px;">进入游戏</button>
    <div id="g1-msg" style="margin-top:10px;color:#ff9d9d;font-size:12px;min-height:16px;text-align:center;"></div>
    <div style="text-align:center;margin-top:10px;"><button id="g1-admin" style="background:none;border:none;color:#5fb6e0;font-size:12px;cursor:pointer;text-decoration:underline;">⚙ 配置 GitHub Token（管理员）</button></div>
  </div>
</div>
<script>
/* 登录门禁（Game1）自包含：不依赖游戏内部函数 */
(function(){
  var LS_USER='game1_user', LS_TOKEN='game1_token';
  var API='https://api.github.com/repos/YunYu-ca/YunYu-ca.github.io';
  var ACCT='Game1Accounts';
  function ls(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
  function unb64(s){ return decodeURIComponent(escape(atob(s))); }
  function sha(s){ return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){ var a=new Uint8Array(b),h=''; for(var i=0;i<a.length;i++) h+=('0'+a[i].toString(16)).slice(-2); return h; }); }
  function ghGet(path){ return fetch(API+'/contents/'+encodeURIComponent(path).replace(/%2F/g,'/'),{headers:{Authorization:'Bearer '+(ls('gamehub_tok_1')||ls(LS_TOKEN)),Accept:'application/vnd.github+json','User-Agent':'fishing'}}).then(function(r){ if(r.status===404) return null; if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
  function ghPut(path,obj,msg){ return ghGet(path).then(function(ex){ return fetch(API+'/contents/'+encodeURIComponent(path).replace(/%2F/g,'/'),{method:'PUT',headers:{Authorization:'Bearer '+(ls('gamehub_tok_1')||ls(LS_TOKEN)),'Content-Type':'application/json',Accept:'application/vnd.github+json','User-Agent':'fishing'},body:JSON.stringify({message:msg||'save',content:b64(JSON.stringify(obj)),...(ex&&ex.sha?{sha:ex.sha}:{})})}).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP '+r.status+': '+t.slice(0,120)); }); }); }); }
  function register(un,pw){ return sha(pw).then(function(ph){ var salt=Math.random().toString(36).slice(2)+Date.now().toString(36); return sha(ph+salt).then(function(h){ return ghGet(ACCT+'/'+un+'.json').then(function(ex){ if(ex) throw new Error('该玩家名已被注册'); return ghPut(ACCT+'/'+un+'.json',{username:un,salt:salt,hash:h,createdAt:new Date().toISOString()},'Game1 register '+un); }); }); }); }
  function login(un,pw){ return ghGet(ACCT+'/'+un+'.json').then(function(ac){ if(!ac) throw new Error('账号不存在'); return sha(pw).then(function(ph){ return sha(ph+ac.salt).then(function(h){ if(h!==ac.hash) throw new Error('密码错误'); return true; }); }); }); }

  if(ls(LS_USER)){ var g=document.getElementById('g1-gate'); if(g) g.remove(); return; }

  var mode='login';
  function setMode(m){
    mode=m;
    var lt=document.getElementById('g1-tab-login'), lr=document.getElementById('g1-tab-reg');
    if(m==='login'){ lt.style.background='#2f7ea8';lt.style.color='#fff';lr.style.background='transparent';lr.style.color='#9cc9e6';document.getElementById('g1-pw').placeholder='密码'; }
    else { lr.style.background='#2f7ea8';lr.style.color='#fff';lt.style.background='transparent';lt.style.color='#9cc9e6';document.getElementById('g1-pw').placeholder='设置密码（至少 4 位）'; }
  }
  document.getElementById('g1-tab-login').onclick=function(){ setMode('login'); };
  document.getElementById('g1-tab-reg').onclick=function(){ setMode('register'); };
  document.getElementById('g1-admin').onclick=function(){ if(window.__HubAdmin){ window.__HubAdmin.open(); return; } if(window.__HubAdmin){ window.__HubAdmin.open(); return; }
    if(document.getElementById('g1-tok-modal')) return;
    var m=document.createElement('div');
    m.id='g1-tok-modal';
    m.style.cssText='position:fixed;top:14px;right:14px;z-index:2147483001;background:#0e3a52;color:#e6f6ff;border:1px solid rgba(120,200,255,.4);border-radius:12px;padding:14px;width:320px;font-family:system-ui;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.6);';
    m.innerHTML='<div style="margin-bottom:8px;font-weight:600;">GitHub 云存档 · 管理员设置</div><div style="color:#9cc9e6;margin-bottom:8px;">填入 GitHub Token（仅授权本仓库的 Fine-grained PAT，Contents 读+写）。Token 只在浏览器本地。</div><input id="g1-tok-inp" type="password" style="width:100%;box-sizing:border-box;padding:6px;border-radius:6px;border:1px solid rgba(120,200,255,.4);background:rgba(0,0,0,.3);color:#e6f6ff;margin-bottom:8px;"><div style="display:flex;gap:8px;"><button id="g1-tok-save" style="flex:1;padding:6px;border-radius:6px;border:none;background:#ffd866;color:#04101c;cursor:pointer;font-weight:600;">保存</button><button id="g1-tok-close" style="padding:6px 10px;border-radius:6px;border:1px solid rgba(120,200,255,.4);background:transparent;color:#9cc9e6;cursor:pointer;">关闭</button></div><div id="g1-tok-msg" style="margin-top:8px;color:#7fe0a0;min-height:14px;"></div>';
    document.body.appendChild(m);
    document.getElementById('g1-tok-inp').value=ls(LS_TOKEN);
    document.getElementById('g1-tok-save').onclick=function(){ var t=document.getElementById('g1-tok-inp').value.trim(); lsSet(LS_TOKEN,t); document.getElementById('g1-tok-msg').textContent=t?'已保存（仅本浏览器）':'已清空 Token'; };
    document.getElementById('g1-tok-close').onclick=function(){ m.remove(); };
  };
  function go(){
    var un=document.getElementById('g1-un').value.trim(), pw=document.getElementById('g1-pw').value;
    var msg=document.getElementById('g1-msg'); msg.style.color='#ff9d9d'; msg.textContent='';
    if(!un||!pw){ msg.textContent='请填写玩家名和密码'; return; }
    if(!(ls('gamehub_tok_1')||ls(LS_TOKEN))){ msg.textContent='管理员尚未配置 GitHub Token（点⚙）'; return; }
    msg.style.color='#7fe0a0'; msg.textContent='正在连接云端…';
    var p = (mode==='register') ? register(un,pw) : login(un,pw);
    p.then(function(){ lsSet(LS_USER,un); msg.textContent='成功，即将进入…'; setTimeout(function(){ location.reload(); },500); })
     .catch(function(e){ msg.style.color='#ff9d9d'; msg.textContent=e&&e.message?e.message:'操作失败'; });
  }
  document.getElementById('g1-go').onclick=go;
  document.getElementById('g1-pw').addEventListener('keydown',function(e){ if(e.key==='Enter') go(); });
})();
</script>
<script>
(function(){
"use strict";
/* ================= 元素 ================= */
var $=function(id){return document.getElementById(id);};
var cvs=$('cvs'), ctx=cvs.getContext('2d');
var hCoins=$('hCoins'), hScore=$('hScore'), hBest=$('hBest'), hCount=$('hCount');
var promptEl=$('prompt'), subEl=$('subPrompt'), fightEl=$('fight'), fightFill=$('fightFill');
var lbList=$('lbList'), lbEmpty=$('lbEmpty'), lbLive=$('lbLive');
var toastEl=$('toast');
var W=0,H=0,DPR=1;

/* ================= 配置与存档 ================= */
var LS_USER='game1_user', LS_TOKEN='game1_token';
var API_BASE='https://api.github.com/repos/YunYu-ca/YunYu-ca.github.io';
var SAVE_PATH='Game1Saves';           // Game1 独立存档文件夹
var LB_PATH='Game1Data/leaderboard.json';

var cfg={user:'',token:''};
try{ cfg.user=localStorage.getItem(LS_USER)||''; cfg.token=localStorage.getItem('gamehub_tok_1')||localStorage.getItem(LS_TOKEN)||''; }catch(e){}

/* 玩家数据 */
var P={ coins:0, score:0, best:0, catches:0, rareFish:0 };
var dirty=false;

function saveSettings(){
  var u=$('inpUser').value.trim(), t=$('inpToken').value.trim();
  if(!u){ note('请填写玩家名'); return; }
  cfg.user=u; cfg.token=t;
  try{ if(t)localStorage.setItem(LS_TOKEN,t); localStorage.setItem(LS_USER,u); }catch(e){}
  note(u+'：配置已保存'+(t?'，Token 已写入本地':'，但未填 Token'));
  if(t) refreshLB();
}
function closeSettings(){ $('settingsOverlay').classList.remove('show'); }
function note(msg){ $('setNote').textContent=msg; }
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show');},2400); }

/* GitHub Contents API 读写 */
function ghHeaders(extra){
  var h={'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  if(cfg.token) h['Authorization']='Bearer '+cfg.token;
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function ghGet(path){
  return fetch(API_BASE+'/contents/'+path, {headers:ghHeaders()})
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw new Error('GET '+r.status); return r.json(); });
}
function ghPut(path,content,sha){
  var body={message:'[游戏自动存档] '+cfg.user+' '+new Date().toISOString(),content:content};
  if(sha) body.sha=sha;
  return fetch(API_BASE+'/contents/'+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error('PUT '+r.status); return r.json(); });
}
function b64(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return btoa(s); } }
function unb64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return atob(s); } }

function packSave(){ return { username:cfg.user, savedAt:new Date().toISOString(), bestScore:P.best, totalScore:P.score, coins:P.coins, totalCatches:P.catches, rareFish:P.rareFish }; }

/* 保存当前玩家存档到 Game1Saves/玩家名.json */
function pushSave(){
  if(!cfg.user||!cfg.token){ return Promise.reject(new Error('未配置玩家名或 Token')); }
  var path=SAVE_PATH+'/'+encodeURIComponent(cfg.user)+'/save.json';
  var data=packSave();
  return ghGet(path).then(function(ex){
    var sha = (ex && ex.sha) ? ex.sha : undefined;
    return ghPut(path, b64(JSON.stringify(data,null,2)), sha);
  }).then(function(){ dirty=false; return true; });
}
function saveNow(){
  if(!cfg.user||!cfg.token){ note('请先配置玩家名与 Token'); return; }
  note('正在保存…');
  pushSave().then(function(){ note('✅ 已保存到 Game1Saves/'+cfg.user+'.json'); toast('存档已保存'); })
    .catch(function(e){ note('保存失败：'+e.message); toast('保存失败：'+e.message); });
}
function loadCloud(){
  if(!cfg.user||!cfg.token){ note('请先配置玩家名与 Token'); return; }
  note('正在从云端恢复…');
  ghGet(SAVE_PATH+'/'+encodeURIComponent(cfg.user)+'/save.json')
    .then(function(ex){
      if(!ex) throw new Error('云端没有该玩家存档');
      var d=JSON.parse(unb64(ex.content));
      P.coins=d.coins||0; P.score=d.totalScore||0; P.best=d.bestScore||0;
      P.catches=d.totalCatches||0; P.rareFish=d.rareFish||0;
      syncHUD(); dirty=false;
      note('✅ 已恢复 '+cfg.user+' 的云端存档'); toast('云端存档已恢复');
    }).catch(function(e){ note('恢复失败：'+e.message); toast('恢复失败：'+e.message); });
}

/* 排行榜：Game1Data/leaderboard.json（top50 by best） */
function loadLB(){
  return ghGet(LB_PATH).then(function(ex){
    if(!ex) return [];
    var arr=JSON.parse(unb64(ex.content));
    return Array.isArray(arr)?arr:[];
  });
}
function writeLB(arr){
  return ghGet(LB_PATH).then(function(ex){
    var sha=(ex&&ex.sha)?ex.sha:undefined;
    return ghPut(LB_PATH, b64(JSON.stringify(arr,null,2)), sha);
  });
}
var lbThrottle=0;
function updateLB(){
  var now=Date.now();
  if(now-lbThrottle<10000) return;   // 收杆后 10 秒节流
  if(!cfg.user||!cfg.token) return;
  lbThrottle=now;
  loadLB().then(function(arr){
    var self={name:cfg.user, best:P.best};
    var found=false;
    for(var i=0;i<arr.length;i++){ if(arr[i].name===cfg.user){ arr[i].best=Math.max(arr[i].best||0,self.best); found=true; break; } }
    if(!found) arr.push(self);
    arr.sort(function(a,b){ return (b.best||0)-(a.best||0); });
    arr=arr.slice(0,50);
    return writeLB(arr);
  }).then(function(){ lbLive.textContent='● 实时'; lbLive.classList.remove('off'); refreshLB(); })
    .catch(function(e){ lbLive.textContent='● 连接异常'; lbLive.classList.add('off'); });
}
function refreshLB(){
  if(!cfg.user||!cfg.token){ lbEmpty.style.display='block'; lbEmpty.textContent='配置 Token 后自动刷新排行榜'; lbList.innerHTML=''; return; }
  loadLB().then(function(arr){
    if(!arr.length){ lbEmpty.style.display='block'; lbEmpty.textContent='暂无数据，钓到鱼后会自动写入'; lbList.innerHTML=''; return; }
    lbEmpty.style.display='none';
    var html=''; var me=cfg.user;
    var top=arr.slice(0,50);
    for(var i=0;i<top.length;i++){
      var r=top[i], isMe=(r.name===me);
      html+='<div class="lb-row'+(i<3?' top':'')+(isMe?' me':'')+'">'+
            '<span class="rk">'+(i+1)+'</span>'+
            '<span class="nm">'+(isMe?'⭐ ':'')+esc(r.name)+'</span>'+
            '<span class="sc">'+(r.best||0)+'</span></div>';
    }
    lbList.innerHTML=html;
  }).catch(function(e){ lbLive.textContent='● 读取失败'; lbLive.classList.add('off'); });
}
function esc(s){ return String(s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }

/* ================= 鱼种 ================= */
var FISH=[
  {name:'小麦穗',emoji:'🐟',value:12,wMin:40,wMax:120,rare:0},
  {name:'鲫鱼',  emoji:'🐠',value:22,wMin:120,wMax:400,rare:0},
  {name:'鲈鱼',  emoji:'🐡',value:40,wMin:300,wMax:1200,rare:0},
  {name:'鲤鱼',  emoji:'🐋',value:65,wMin:600,wMax:2500,rare:0},
  {name:'锦鲤',  emoji:'🐬',value:120,wMin:800,wMax:3000,rare:1},
  {name:'金龙·龙鲤',emoji:'🐉',value:300,wMin:1500,wMax:5000,rare:2}
];
function randFish(){
  var r=Math.random();
  var idx;
  if(r<0.38) idx=0; else if(r<0.66) idx=1; else if(r<0.86) idx=2;
  else if(r<0.97) idx=3; else if(r<0.995) idx=4; else idx=5;
  return FISH[idx];
}

/* ================= 状态机 ================= */
var ST={IDLE:0,CHARGING:1,FLYING:2,WAITING:3,BITING:4,REELING:5,RESULT:6};
var st=ST.IDLE;
var power=0, aimX=0.5;               // 蓄力 / 横向瞄准 0..1
var bob={x:0,y:0,t:0,phase:0,landed:false};   // 浮漂
var lineFrom={x:0,y:0};
var currentFish=null;
var fight={v:50,target:50,active:false};     // 收线对抗 0..100
var resultTimer=0, catchFish=null;
var biteAt=0;
var rAF=0, last=0;

/* ================= 输入 ================= */
function pressStart(e){
  e.preventDefault();
  if(st===ST.IDLE){ st=ST.CHARGING; power=0; }
  else if(st===ST.WAITING){ startHook(); }
  else if(st===ST.BITING){ startHook(); }
}
function pressMove(e){
  var rect=cvs.getBoundingClientRect();
  var x=(e.clientX!==undefined?e.clientX:e.touches[0].clientX)-rect.left;
  aimX=Math.max(0,Math.min(1,x/rect.width));
}
function pressEnd(e){
  e.preventDefault();
  if(st===ST.CHARGING){ cast(); }
}
cvs.addEventListener('mousedown',pressStart);
cvs.addEventListener('mousemove',pressMove);
window.addEventListener('mouseup',pressEnd);
cvs.addEventListener('touchstart',pressStart,{passive:false});
cvs.addEventListener('touchmove',pressMove,{passive:false});
window.addEventListener('touchend',pressEnd);
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(st===ST.IDLE){st=ST.CHARGING;power=0;} else if(st===ST.WAITING||st===ST.BITING){startHook();} }
});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'||e.code==='Enter'){ if(st===ST.CHARGING) cast(); }
});

/* ================= 玩法动作 ================= */
function cast(){
  var p=Math.min(1,Math.max(0.12,power));
  var rect=cvs.getBoundingClientRect();
  // 浮漂落点：由横向瞄准 + 蓄力决定距离
  var dist=0.30+0.5*p;
  var bx=aimX*W;
  var by=H*(0.52+0.10*(1-p));       // 蓄力越大落得越远（水面更深处）
  // 简化：让距离基于蓄力，落点在视野水面
  var targetY=H*0.40 + dist*H*0.55;
  bob.x=bx; bob.y=Math.min(targetY,H*0.86); bob.phase=0; bob.landed=false;
  lineFrom={x:W*0.5,y:H*0.28};
  bob.t=0;
  st=ST.FLYING;
  promptEl.textContent=''; subEl.textContent='';
  setTimeout(function(){ if(st===ST.FLYING){ bob.landed=true; st=ST.WAITING; promptEl.textContent='等待鱼儿咬钩…'; subEl.textContent='浮漂下沉时点击收竿！'; promptEl.classList.add('show'); subEl.classList.add('show'); scheduleBite(); } }, 700);
}
function scheduleBite(){
  setTimeout(function(){
    if(st!==ST.WAITING) return;
    currentFish=randFish();
    st=ST.BITING; biteAt=Date.now();
    promptEl.textContent='拉竿！'+currentFish.emoji+' 上钩了！';
    subEl.textContent='快点击 / 按空格收竿！';
  }, 1800+Math.random()*3600);
}
function startHook(){
  if(st!==ST.WAITING&&st!==ST.BITING) return;
  if(st===ST.WAITING){
    // 抢竿：小概率空钩
    promptEl.textContent='空钩……再等等';
    subEl.textContent='';
    st=ST.IDLE;
    setTimeout(function(){ promptEl.classList.remove('show'); subEl.classList.remove('show'); },900);
    return;
  }
  // 进入收线对抗
  st=ST.REELING;
  fight.v=55; fight.target=55; fight.active=true;
  fightEl.classList.add('show');
  promptEl.textContent='和'+currentFish.name+'拔河！';
  subEl.textContent='按住/点击收线，松手让鱼挣扎';
  fightFill.style.width=fight.v+'%';
}
function finishHook(ok){
  st=ST.RESULT; resultTimer=0;
  fightEl.classList.remove('show');
  if(ok){
    var f=currentFish;
    var w=Math.round(f.wMin+Math.random()*(f.wMax-f.wMin));
    var pts=Math.round(f.value*(0.8+Math.random()*0.4));
    P.coins+=f.value; P.score+=pts; P.catches+=1;
    if(f.rare>0) P.rareFish+=1;
    if(P.score>P.best) P.best=P.score;
    catchFish={name:f.name,emoji:f.emoji,w:w,pts:pts,rare:f.rare};
    promptEl.textContent='🎣 钓到 '+f.emoji+' '+f.name+'（'+w+'g）！ +'+pts;
    subEl.textContent='金币 +'+f.value;
    dirty=true;
    syncHUD();
    updateLB();
  } else {
    catchFish=null;
    promptEl.textContent='鱼挣脱了……';
    subEl.textContent='';
  }
  promptEl.classList.add('show'); subEl.classList.add('show');
  currentFish=null;
}

/* ================= 更新循环 ================= */
function update(dt){
  // 蓄力
  if(st===ST.CHARGING){ power=Math.min(1,power+dt*1.4); }
  // 浮漂在飞行/水上
  if(st===ST.FLYING||st===ST.WAITING||st===ST.BITING){
    bob.phase+=dt*2.4;
    bob.t+=dt;
  }
  // 咬钩窗口：2.5 秒内没收竿→回到等待
  if(st===ST.BITING && Date.now()-biteAt>2500){
    st=ST.WAITING; currentFish=null;
    promptEl.textContent='鱼儿跑了，继续等待…';
    scheduleBite();
  }
  // 收线对抗
  if(st===ST.REELING && fight.active){
    // 鱼挣扎：向 0 下拉
    fight.v -= dt*9;
    // 玩家按住收线
    if(pressing) fight.v += dt*20;
    fight.v=Math.max(0,Math.min(100,fight.v));
    fightFill.style.width=fight.v+'%';
    if(fight.v>=100){ finishHook(true); }
    else if(fight.v<=0){ finishHook(false); }
  }
  // 结果停留
  if(st===ST.RESULT){
    resultTimer+=dt;
    if(resultTimer>2.2){ st=ST.IDLE; promptEl.classList.remove('show'); subEl.classList.remove('show'); catchFish=null; }
  }
}
var pressing=false;
window.addEventListener('mousedown',function(){pressing=true;});
window.addEventListener('mouseup',function(){pressing=false;});
window.addEventListener('touchstart',function(){pressing=true;},{passive:true});
window.addEventListener('touchend',function(){pressing=false;},{passive:true});

/* ================= 渲染（第一人称） ================= */
function draw(t){
  var w=W,h=H;
  // 天空
  var sky=ctx.createLinearGradient(0,0,0,h*0.55);
  sky.addColorStop(0,'#3f8fc0'); sky.addColorStop(0.5,'#bfe3f5'); sky.addColorStop(1,'#e8f7ff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h*0.55);
  // 太阳
  ctx.globalAlpha=0.95;
  var sx=w*0.82, sy=h*0.12, sr=Math.min(w,h)*0.05;
  var glow=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*3);
  glow.addColorStop(0,'rgba(255,240,190,0.9)'); glow.addColorStop(1,'rgba(255,240,190,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,sr*3,0,6.283); ctx.fill();
  ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(sx,sy,sr,0,6.283); ctx.fill();
  // 云
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(var i=0;i<4;i++){
    var cx=((w*0.2+i*0.24*w)+t*8)%(w+200)-100;
    var cy=h*(0.07+i*0.06);
    ellipse(cx,cy,44,16);
    ellipse(cx+22,cy-8,30,12);
    ellipse(cx-22,cy+2,26,10);
  }
  // 远山
  ctx.fillStyle='#7fb39a';
  ctx.beginPath(); ctx.moveTo(0,h*0.42);
  for(var mx=0;mx<=w;mx+=w/24){ ctx.lineTo(mx,h*(0.42+0.05*Math.abs(Math.sin(mx*0.003+1.2)))); }
  ctx.lineTo(w,h*0.44); ctx.lineTo(0,h*0.44); ctx.closePath(); ctx.fill();
  // 水面
  var wGrad=ctx.createLinearGradient(0,h*0.45,0,h);
  wGrad.addColorStop(0,'#2e7ea8'); wGrad.addColorStop(0.6,'#1d5f86'); wGrad.addColorStop(1,'#12384f');
  ctx.fillStyle=wGrad; ctx.fillRect(0,h*0.45,w,h*0.55);
  // 水波
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.4;
  for(var wi=0;wi<9;wi++){
    var y=h*(0.48+wi*0.05);
    ctx.beginPath();
    for(var wx=0;wx<=w;wx+=10){
      var yy=y+Math.sin((wx*0.02+wi)+t*(1+wi*0.3))*3;
      if(wx===0) ctx.moveTo(wx,yy); else ctx.lineTo(wx,yy);
    }
    ctx.stroke();
  }
  // 浮漂（在水面）
  if(st!==ST.IDLE && st!==ST.CHARGING){
    var bY=bob.y, dip=0;
    if(st===ST.BITING){ dip=18*Math.abs(Math.sin(bob.phase*6)); }
    else if(st===ST.WAITING){ dip=3*Math.sin(bob.phase*3); }
    var bY2=bY+dip;
    // 水面倒影涟漪
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(bob.x,bY,22,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.arc(bob.x,bY,34,0,6.283); ctx.stroke();
    // 浮漂本体
    ctx.fillStyle='#ff5a3c'; ctx.beginPath(); ctx.arc(bob.x,bY2-5,7,0,6.283); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bob.x,bY2-5,3,0,6.283); ctx.fill();
    ctx.strokeStyle='#ff5a3c'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bob.x,bY2-5); ctx.lineTo(bob.x,bY2-13); ctx.stroke();
  }
  // 鱼线：从竿尖到浮漂
  if(st===ST.FLYING||st===ST.WAITING||st===ST.BITING||st===ST.REELING){
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(lineFrom.x,lineFrom.y);
    ctx.quadraticCurveTo(W*0.5,H*0.35,bob.x,bob.y-5);
    ctx.stroke();
  }
  // 第一人称：岸堤 + 手 + 鱼竿
  drawDockAndRod(h);

  // 收线时显示鱼在水面扑腾
  if(st===ST.REELING && currentFish){
    ctx.font='26px sans-serif'; ctx.textAlign='center';
    var fx=bob.x+Math.sin(t*14)*14, fy=bob.y-20;
    ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=8;
    ctx.fillText(currentFish.emoji,fx,fy);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  // 蓄力指示
  if(st===ST.CHARGING){
    ctx.fillStyle='rgba(255,214,102,'+(0.25+0.5*power)+')';
    ctx.beginPath(); ctx.arc(W*0.5,H*0.30,10+power*40,0,6.283); ctx.fill();
    ctx.fillStyle='#ffd866'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('松手抛竿！',W*0.5,H*0.18);
  }
}
function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,6.283); ctx.fill(); }
function drawDockAndRod(h){
  // 岸堤（下边缘第一人称木板）
  var dTop=h*0.86;
  var g=ctx.createLinearGradient(0,dTop,0,h);
  g.addColorStop(0,'#7d5636'); g.addColorStop(1,'#4a2f1a');
  ctx.fillStyle=g; ctx.fillRect(0,dTop,W,h-dTop);
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
  for(var i=0;i<7;i++){ var y=dTop+6+i*((h-dTop-8)/7); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // 鱼竿（第一人称，从下方伸向水面）
  var handX=W*0.5, handY=h*0.95;
  var tipX=W*0.5, tipY=h*0.30;
  // 竿身
  ctx.strokeStyle='#3a2b1c'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(handX,handY); ctx.quadraticCurveTo(handX+30,handY-120,tipX+40,tipY); ctx.stroke();
  ctx.strokeStyle='#6b4a2f'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(handX,handY); ctx.quadraticCurveTo(handX+30,handY-120,tipX+40,tipY); ctx.stroke();
  // 手（简单剪影）
  ctx.fillStyle='#c98a4b';
  ctx.beginPath(); ctx.arc(handX-4,handY-6,15,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(handX+16,handY-4,14,0,6.283); ctx.fill();
  // 竿尖位置更新为世界坐标供鱼线使用
  lineFrom={x:tipX+40,y:tipY};
}

/* ================= 主循环 ================= */
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000); last=ts;
  update(dt);
  draw(ts/1000);
  rAF=requestAnimationFrame(loop);
}
function resize(){
  DPR=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  aimX=0.5;
}
window.addEventListener('resize',resize);

/* ================= HUD ================= */
function syncHUD(){
  hCoins.textContent=fmt(P.coins);
  hScore.textContent=fmt(P.score);
  hBest.textContent=fmt(P.best);
  hCount.textContent=P.catches;
}
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

/* ================= 退出确认（用户锁定口径） ================= */
function doExit(){ location.href='https://yunyu-ca.github.io/Game.html'; }
function confirmExit(){
  var ok=window.confirm('是否确定保存存档？');
  if(ok){
    if(cfg.token&&cfg.user){
      pushSave().then(function(){ doExit(); }).catch(function(e){ alert('网络错误，保存失败'); });
    } else {
      doExit();
    }
  } else {
    var ok2=window.confirm('是否确定不保存？未保存的进度将丢失');
    if(ok2){
      alert('当前存档记录将不会被保存');
      doExit();
    }
    // 否则留在游戏
  }
}
$('btnExit').addEventListener('click',function(e){ e.stopPropagation(); confirmExit(); });
$('btnSettings').addEventListener('click',function(e){ e.stopPropagation(); openSettings(); });
function openSettings(){
  $('inpUser').value=cfg.user;
  $('inpToken').value=cfg.token;
  $('settingsOverlay').classList.add('show');
}
function toggleLB(){ $('leaderboard').classList.toggle('open'); }

// beforeunload 尽力而为（浏览器可能拦截弹窗）
window.addEventListener('beforeunload',function(e){
  if(dirty && cfg.user && cfg.token){
    try{
      var ok=window.confirm('是否确定保存存档？');
      if(ok){ pushSave(); }
      else{
        var ok2=window.confirm('是否确定不保存？未保存的进度将丢失');
        if(ok2){ alert('当前存档记录将不会被保存'); }
        else{ e.preventDefault(); e.returnValue=''; }
      }
    }catch(err){}
  }
});

/* ================= 启动 ================= */
resize();
requestAnimationFrame(function(ts){ last=ts; rAF=requestAnimationFrame(loop); });
$('inpUser').value=cfg.user; $('inpToken').value=cfg.token;
if(cfg.user) refreshLB();
promptEl.textContent='第一人称钓鱼乐园 · 点击蓄力抛竿';
subEl.textContent='按住瞄准 + 蓄力，松手抛出，浮漂下沉即收竿';
promptEl.classList.add('show'); subEl.classList.add('show');
setTimeout(function(){ promptEl.classList.remove('show'); subEl.classList.remove('show'); },2600);
})();
</script>







<script id="cloud-hub">
/* ===== 跨设备云配置 v3（__HubAdmin）：5 个游戏各自独立 token，加密存仓库 GameHub/config.json =====
 * config.json: { v:2, adminSalt, adminHash, salt, iv, data }
 *   data(解密后) = { t1,t2,t3,t4,t5 }  ← 各游戏自己的 GitHub token
 * 本机缓存: gamehub_tok_<slot>（各游戏各自的 token；slot 由 window.__HUB_SLOT 指定）
 * 安全：修改前必须先验证管理员密码；密码/Token 均提供明文显示开关。任一设备配置一次全同步，修改需密码。
 */
(function(){
  if(window.__HubAdmin) return;
  var CFG_PATH = 'GameHub/config.json';
  var API = 'https://api.github.com/repos/YunYu-ca/YunYu-ca.github.io/contents/';

  function mySlot(){ return parseInt(window.__HUB_SLOT||'1',10)||1; }
  function tokKey(slot){ return 'gamehub_tok_'+slot; }
  function ls(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function sha256hex(s){ return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){ return bytesToHex(new Uint8Array(b)); }); }
  function rndHex(n){ var a=new Uint8Array(n); crypto.getRandomValues(a); return bytesToHex(a); }
  function bytesToHex(a){ return Array.prototype.map.call(a,function(x){ return x.toString(16).padStart(2,'0'); }).join(''); }
  function hexToBytes(h){ var a=new Uint8Array(h.length/2); for(var i=0;i<a.length;i++) a[i]=parseInt(h.substr(i*2,2),16); return a; }
  function b64ToBytes(s){ var bin=atob(s), a=new Uint8Array(bin.length); for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a; }
  function bytesToB64(a){ var s=''; for(var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }

  function deriveKey(password, saltHex){
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function(km){
      return crypto.subtle.deriveKey({name:'PBKDF2', salt:hexToBytes(saltHex), iterations:150000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    });
  }
  async function enc(password, saltHex, dataStr){
    var key=await deriveKey(password,saltHex), iv=crypto.getRandomValues(new Uint8Array(12));
    var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv}, key, new TextEncoder().encode(dataStr));
    return {iv:bytesToHex(iv), data:bytesToB64(new Uint8Array(ct))};
  }
  async function dec(password, saltHex, ivHex, dataB64){
    var key=await deriveKey(password,saltHex);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:hexToBytes(ivHex)}, key, b64ToBytes(dataB64));
    return new TextDecoder().decode(pt);
  }

  function getToken(){ return ls(tokKey(mySlot())); }
  function isSet(){ return !!ls(tokKey(mySlot())); }

  function fetchCfg(){
    return fetch(API + encodeURIComponent(CFG_PATH).replace(/%2F/g,'/'), {headers:{'User-Agent':'gamehub','Accept':'application/vnd.github+json'}}).then(function(r){
      if(r.status===404) return null;
      if(!r.ok) throw new Error('拉取配置失败 HTTP '+r.status);
      return r.json().then(function(j){
        var txt = (j && j.encoding==='base64' && j.content) ? atob(j.content) : JSON.stringify(j);
        return JSON.parse(txt);
      });
    });
  }
  function writeCfg(cfg, token, msg){
    return fetch(API + encodeURIComponent(CFG_PATH).replace(/%2F/g,'/')).then(function(r){
      return r.ok ? r.json() : null;
    }).then(function(ex){
      var body={message:msg||'update cloud config', content:b64(JSON.stringify(cfg))};
      if(ex && ex.sha) body.sha=ex.sha;
      return fetch(API + encodeURIComponent(CFG_PATH).replace(/%2F/g,'/'),{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json','User-Agent':'gamehub','Accept':'application/vnd.github+json'},body:JSON.stringify(body)});
    }).then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error('写入配置失败 HTTP '+r.status+': '+t.slice(0,120)); }); return true; });
  }
  function b64(s){ var b=unescape(encodeURIComponent(s)); var out=''; for(var i=0;i<b.length;i++) out+=String.fromCharCode(b.charCodeAt(i)); return btoa(out); }
  function cacheTokens(obj){ for(var i=1;i<=5;i++){ if(obj['t'+i]) lsSet(tokKey(i), obj['t'+i]); } }

  /* 首次配置：管理员密码 + 5 个游戏各自的 token，加密写仓库 */
  async function setup(pw, toks){
    if(!pw||String(pw).length<4) throw new Error('管理员密码至少4位');
    var any=false; for(var i=0;i<5;i++){ if(toks[i]&&String(toks[i]).trim()) any=true; }
    if(!any) throw new Error('请至少填一个游戏的 GitHub Token');
    var salt=rndHex(16), adminHash=await sha256hex(salt+':'+pw);
    var t={}; for(var j=0;j<5;j++){ if(toks[j]&&String(toks[j]).trim()) t['t'+(j+1)]=String(toks[j]).trim(); }
    var encr=await enc(pw, salt, JSON.stringify(t));
    var cfg={v:2, adminSalt:salt, adminHash:adminHash, salt:salt, iv:encr.iv, data:encr.data};
    var writeTok=''; for(var k=1;k<=5;k++){ if(t['t'+k]){ writeTok=t['t'+k]; break; } }
    await writeCfg(cfg, writeTok, 'init cloud config');
    cacheTokens(t);
    return {ok:true, message:'已加密写入仓库，所有设备自动同步'};
  }

  /* 解锁：验证密码并解密，缓存全部 5 个 token */
  async function unlock(pw){
    var cfg=await fetchCfg();
    if(!cfg) throw new Error('仓库无配置，请先完成首次配置');
    if(await sha256hex(cfg.adminSalt+':'+pw)!==cfg.adminHash) throw new Error('管理员密码错误');
    var plain=await dec(pw, cfg.salt, cfg.iv, cfg.data);
    var obj=JSON.parse(plain);
    if(!obj['t'+mySlot()]) throw new Error('本游戏未配置 Token，请点⚙️补充');
    cacheTokens(obj);
    return {ok:true, message:'解锁成功，云存档已启用'};
  }

  /* 修改：旧密码验证，可改任意游戏的 token，写回仓库 */
  async function modify(pw, toks, newPw){
    var cfg=await fetchCfg();
    if(!cfg) throw new Error('仓库无配置，请先完成首次配置');
    if(await sha256hex(cfg.adminSalt+':'+pw)!==cfg.adminHash) throw new Error('管理员密码错误');
    var plain=await dec(pw, cfg.salt, cfg.iv, cfg.data);
    var obj=JSON.parse(plain);
    var writeTok='';
    for(var i=0;i<5;i++){ if(toks[i]!==undefined && toks[i]!==null && String(toks[i]).trim()!==''){ obj['t'+(i+1)]=String(toks[i]).trim(); } }
    for(var k=1;k<=5;k++){ if(obj['t'+k]){ writeTok=obj['t'+k]; break; } }
    if(!writeTok) throw new Error('配置中没有可用 token 作为写入凭据');
    var newSalt=cfg.salt, newHash=cfg.adminHash, encrSalt=cfg.salt, encrIv=cfg.iv, encrData=cfg.data;
    if(newPw && String(newPw).length>=4){
      newSalt=rndHex(16); newHash=await sha256hex(newSalt+':'+newPw); encrSalt=newSalt;
      var e=await enc(newPw, newSalt, JSON.stringify(obj)); encrIv=e.iv; encrData=e.data;
    } else {
      var e2=await enc(pw, cfg.salt, JSON.stringify(obj)); encrIv=e2.iv; encrData=e2.data;
    }
    var newCfg={v:2, adminSalt:newSalt, adminHash:newHash, salt:encrSalt, iv:encrIv, data:encrData};
    await writeCfg(newCfg, writeTok, 'update cloud config');
    cacheTokens(obj);
    return {ok:true, message:'已更新并同步到所有设备'};
  }

  /* ---- UI：两段式（修改/解锁先验密码；首次配置直接设密码+Token），Token 明文可见，密码可显隐 ---- */
  var LABELS=['Game1 钓鱼','Game2','Game3 塔防','Game4 农场','Game5 筹码'];
  function tokenFields(prefix, vals){
    var s='';
    for(var i=0;i<5;i++){
      var cur = (vals && vals['t'+(i+1)]) ? vals['t'+(i+1)] : '';
      s+='<label style="font-size:12px;color:#8a93ad;margin-top:8px;display:block;">'+LABELS[i]+' Token'+(mySlot()===i+1?'（本游戏）':'')+'</label>'
        +'<input id="'+prefix+i+'" type="text" style="width:100%;box-sizing:border-box;padding:7px;border-radius:8px;border:1px solid #334;background:#0a1120;color:#eef;font-size:13px;margin-bottom:6px;" placeholder="ghp_xxx / github_pat_xxx" value="'+esc(cur)+'">';
    }
    return s;
  }
  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function open(opts){
    opts=opts||{}; if(document.getElementById('hub-admin')) return;
    var d=document.createElement('div'); d.id='hub-admin';
    d.style.cssText='position:fixed;inset:0;z-index:2147482999;background:rgba(8,12,26,.94);display:flex;align-items:center;justify-content:center;font-family:-apple-system,"Microsoft YaHei",sans-serif;color:#e2e8f0;';
    d.innerHTML='<div style="width:440px;background:#111a2e;border:1px solid #334;border-radius:14px;padding:22px;box-sizing:border-box;max-height:94vh;overflow:auto;">'
      +'<h3 id="hub-title" style="margin:0 0 4px;font-size:17px;text-align:center;">⚙️ 云存档配置（跨设备 · 每游戏独立 Token）</h3>'
      +'<p id="hub-sub" style="margin:0 0 12px;font-size:12px;color:#8a93ad;text-align:center;line-height:1.5;">正在连接仓库…</p>'
      +'<div id="hub-form">'
        // 阶段一：密码
        +'<div id="hub-stage1">'
          +'<label style="font-size:12px;color:#8a93ad;" id="hub-pw-label">管理员密码</label>'
          +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">'
            +'<input id="hub-pw" type="password" style="flex:1;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #334;background:#0a1120;color:#eef;font-size:14px;" autocomplete="off">'
            +'<button id="hub-eye" type="button" style="padding:8px 10px;border-radius:8px;border:1px solid #334;background:#0a1120;color:#a5b4cf;cursor:pointer;font-size:13px;">显示</button>'
          +'</div>'
          +'<button id="hub-next" style="width:100%;padding:10px;border-radius:9px;border:none;background:linear-gradient(90deg,#3b82f6,#6366f1);color:#fff;font-size:15px;font-weight:700;cursor:pointer;">确定</button>'
        +'</div>'
        // 阶段二：Token 编辑（修改/首次配置）
        +'<div id="hub-stage2" style="display:none;">'
          +'<div id="hub-tok-wrap"></div>'
          +'<div id="hub-newpw-wrap" style="display:none;"><label style="font-size:12px;color:#8a93ad;">新管理员密码（可选，留空不改密码）</label>'
            +'<input id="hub-newpw" type="password" style="width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid #334;background:#0a1120;color:#eef;font-size:13px;margin-bottom:8px;"></div>'
          +'<button id="hub-save" style="width:100%;padding:10px;border-radius:9px;border:none;background:linear-gradient(90deg,#10b981,#059669);color:#fff;font-size:15px;font-weight:700;cursor:pointer;">保存修改</button>'
        +'</div>'
      +'</div>'
      +'<div id="hub-msg" style="margin-top:10px;font-size:13px;min-height:18px;text-align:center;"></div>'
      +'<div style="margin-top:10px;text-align:center;"><button id="hub-close" style="background:none;border:none;color:#94a3b8;font-size:12px;cursor:pointer;">关闭</button></div>'
      +'</div>';
    document.body.appendChild(d);
    var mode='init';
    var title=d.querySelector('#hub-title'), sub=d.querySelector('#hub-sub'), msg=d.querySelector('#hub-msg');
    var s1=d.querySelector('#hub-stage1'), s2=d.querySelector('#hub-stage2');
    var pw=d.querySelector('#hub-pw'), npw=d.querySelector('#hub-newpw'), nwrap=d.querySelector('#hub-newpw-wrap');
    var tokWrap=d.querySelector('#hub-tok-wrap'), next=d.querySelector('#hub-next'), save=d.querySelector('#hub-save');
    function show(m,c){ msg.textContent=m; msg.style.color=c||'#f87171'; }
    function readToks(){ var a=[]; for(var i=0;i<5;i++){ var el=document.getElementById('hub-t'+i); a.push(el?el.value:''); } return a; }
    d.querySelector('#hub-close').onclick=function(){ d.remove(); };
    d.querySelector('#hub-eye').onclick=function(){
      pw.type = (pw.type==='password') ? 'text' : 'password';
      d.querySelector('#hub-eye').textContent = (pw.type==='password') ? '显示' : '隐藏';
    };
    next.onclick = function(){
      return (function(){ try{
        var p = pw.value;
        if(!p) throw new Error('请输入管理员密码');
        if(mode==='setup'){ show('正在写入仓库…','#e2e8f0'); return setup(p, readToks()).then(function(r){ show(r.message,'#4ade80'); if(r.ok) setTimeout(function(){d.remove();},1300); }); }
        else if(mode==='unlock'){ show('正在解密…','#e2e8f0'); return unlock(p).then(function(r){ show(r.message,'#4ade80'); if(r.ok) setTimeout(function(){d.remove();},1300); }); }
        else if(mode==='modify'){ show('正在验证…','#e2e8f0'); return verifyThenEdit(p); }
      }catch(e){ return Promise.reject(e); }})()
        .catch(function(e){ show(e.message||'失败','#f87171'); });
    };
    save.onclick = function(){
      return (function(){ try{
        if(mode==='setup'){
          show('正在写入仓库…','#e2e8f0');
          return setup(pw.value, readToks()).then(function(r){ show(r.message,'#4ade80'); if(r.ok) setTimeout(function(){d.remove();},1400); });
        }
        show('正在更新并同步…','#e2e8f0');
        return modify(pw.value, readToks(), npw.value).then(function(r){ show(r.message,'#4ade80'); if(r.ok) setTimeout(function(){d.remove();},1400); });
      }catch(e){ return Promise.reject(e); }})()
        .catch(function(e){ show(e.message||'失败','#f87171'); });
    };
    // 修改模式：验证密码通过后，把解密出的当前 token 预填到可见输入框供编辑
    function verifyThenEdit(p){
      return unlock(p).then(function(){
        return fetchCfg().then(function(cfg){
          return dec(p, cfg.salt, cfg.iv, cfg.data).then(function(plain){
            var obj=JSON.parse(plain);
            s1.style.display='none'; s2.style.display='block';
            tokWrap.innerHTML = tokenFields('hub-t', obj);
            nwrap.style.display='block';
            title.textContent='⚙️ 修改云配置（Token 明文可编辑）';
            sub.textContent='改完保存即同步所有设备；可同时修改任意游戏的 Token / 管理员密码';
            show('密码正确，可修改', '#4ade80');
          });
        });
      });
    }
    // 判定初始模式
    fetchCfg().then(function(cfg){
      if(cfg){
        if(getToken()){ mode='modify'; title.textContent='⚙️ 修改云配置'; sub.textContent='先输入管理员密码验证，通过后即可修改各游戏 Token'; d.querySelector('#hub-pw-label').textContent='管理员密码（用于修改）'; }
        else { mode='unlock'; title.textContent='🔓 云存档解锁'; sub.textContent='配置已存在。输入管理员密码解锁（本机只需一次）'; }
      } else {
        mode='setup'; title.textContent='⚙️ 首次配置（每游戏独立 Token）'; sub.textContent='设置管理员密码 + 各游戏 GitHub Token，加密写入仓库，所有设备自动同步'; d.querySelector('#hub-pw-label').textContent='设置管理员密码（至少4位）';
        // 首次配置直接展示 Token 输入
        s1.style.display='none'; s2.style.display='block';
        tokWrap.innerHTML = tokenFields('hub-t', {});
        save.textContent='保存配置';
      }
    }).catch(function(e){ show(e.message||'连接仓库失败','#f87171'); });
  }

  /* 启动：本机无该游戏 token 则拉仓库配置决定解锁/首次配置 */
  function ensure(){
    if(getToken()) return;
    fetchCfg().then(function(cfg){
      open({});
    }).catch(function(){});
  }

  window.__HubAdmin={ getToken:getToken, isSet:isSet, open:open, ensure:ensure, unlock:unlock, setup:setup, modify:modify, fetchCfg:fetchCfg, mySlot:mySlot, tokKey:tokKey };
})();

</script>
<script id="cloud-hub-run">
(function(){ window.__HUB_SLOT=1; function run(){ if(window.__HubAdmin) window.__HubAdmin.ensure(); } if(document.readyState==="complete"){ setTimeout(run,300); } else { window.addEventListener("load",function(){ setTimeout(run,300); }); } })();
</script></body>
</html>
