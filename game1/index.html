<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钓鱼乐园 · 第一人称 | FISHING PARADISE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b2a3d; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  #wrap { position:fixed; inset:0; }
  #cvs { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  /* ===== HUD ===== */
  #hud { position:absolute; top:12px; left:12px; display:flex; gap:10px; flex-wrap:wrap; z-index:10; pointer-events:none; }
  .chip { background:rgba(8,28,45,.72); color:#dff3ff; border:1px solid rgba(120,200,255,.35); border-radius:12px; padding:6px 12px; font-size:13px; backdrop-filter:blur(4px); box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .chip b { color:#ffd866; font-weight:700; }
  .chip .lb { color:#ff9d5c; font-weight:700; }

  #topBar { position:absolute; top:10px; right:12px; display:flex; gap:8px; z-index:12; }
  .btn { pointer-events:auto; background:rgba(8,28,45,.78); color:#e6f6ff; border:1px solid rgba(120,200,255,.4); border-radius:10px; padding:7px 12px; font-size:13px; cursor:pointer; backdrop-filter:blur(4px); box-shadow:0 2px 6px rgba(0,0,0,.3); }
  .btn:hover { background:rgba(20,50,75,.9); }
  .btn.primary { background:#2f7ea8; border-color:#5fb6e0; }
  .btn.danger { color:#ffc0b8; border-color:rgba(255,120,100,.5); }

  /* ===== 提示 ===== */
  #prompt { position:absolute; top:34%; left:50%; transform:translate(-50%,-50%); z-index:11; color:#fff; font-size:26px; font-weight:800; text-align:center; text-shadow:0 2px 12px rgba(0,0,0,.8); pointer-events:none; opacity:0; transition:opacity .25s; letter-spacing:2px; }
  #prompt.show { opacity:1; }
  #subPrompt { position:absolute; top:46%; left:50%; transform:translate(-50%,0); z-index:11; color:#cdeeff; font-size:15px; text-align:center; text-shadow:0 1px 8px rgba(0,0,0,.8); pointer-events:none; opacity:0; transition:opacity .25s; }
  #subPrompt.show { opacity:1; }

  /* ===== 收线对抗条 ===== */
  #fight { position:absolute; left:50%; bottom:130px; transform:translateX(-50%); width:min(340px,80%); z-index:11; display:none; }
  #fight.show { display:block; }
  #fightLabel { color:#fff; font-size:13px; margin-bottom:5px; text-align:center; text-shadow:0 1px 6px rgba(0,0,0,.8); }
  #fightTrack { height:16px; border-radius:9px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.35); overflow:hidden; position:relative; }
  #fightFill { height:100%; width:0%; background:linear-gradient(90deg,#ff5a3c,#ffd866 50%,#4cd97b); border-radius:8px; transition:width .08s linear; }
  #fightMark { position:absolute; top:-3px; bottom:-3px; width:3px; background:#fff; box-shadow:0 0 6px #fff; left:50%; }

  /* ===== 排行榜 ===== */
  #leaderboard { position:absolute; top:56px; right:12px; width:250px; background:rgba(8,28,45,.82); border:1px solid rgba(120,200,255,.35); border-radius:14px; color:#e6f6ff; z-index:11; backdrop-filter:blur(6px); box-shadow:0 4px 20px rgba(0,0,0,.4); overflow:hidden; }
  #lbHead { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:rgba(0,0,0,.25); }
  #lbHead .t { font-weight:800; font-size:14px; }
  #lbLive { font-size:11px; color:#9fe8a0; }
  #lbLive.off { color:#ff9d9d; }
  #lbList { max-height:340px; overflow-y:auto; }
  .lb-row { display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; border-top:1px solid rgba(255,255,255,.06); }
  .lb-row .rk { width:22px; text-align:center; color:#9cc9e6; font-weight:700; }
  .lb-row.top .rk { color:#ffd866; }
  .lb-row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb-row .sc { color:#ffd866; font-weight:700; }
  .lb-row.me { background:rgba(47,126,168,.35); }
  #lbEmpty { padding:16px; text-align:center; color:#9cc9e6; font-size:13px; }

  /* ===== 设置 ===== */
  #settingsOverlay { position:fixed; inset:0; background:rgba(4,16,26,.7); display:none; align-items:center; justify-content:center; z-index:50; }
  #settingsOverlay.show { display:flex; }
  #settingsBox { background:#0e3a52; color:#e6f6ff; border:1px solid rgba(120,200,255,.4); border-radius:16px; width:min(400px,90%); padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.6); }
  #settingsBox h2 { font-size:18px; margin-bottom:4px; }
  #settingsBox .sub { font-size:12px; color:#9cc9e6; margin-bottom:14px; }
  #settingsBox label { display:block; font-size:13px; margin:10px 0 4px; color:#cdeeff; }
  #settingsBox input { width:100%; padding:9px 11px; border-radius:8px; border:1px solid rgba(120,200,255,.4); background:rgba(0,0,0,.3); color:#fff; font-size:14px; }
  #settingsBox input:focus { outline:none; border-color:#5fb6e0; }
  #settingsBox .row { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  #settingsBox .row .btn { flex:1; min-width:100px; text-align:center; }
  #setNote { font-size:12px; color:#ffd866; margin-top:10px; min-height:16px; }
  #settingsBox .tip { font-size:11px; color:#8fb8d0; margin-top:10px; line-height:1.5; }

  #toast { position:absolute; left:50%; bottom:20px; transform:translateX(-50%); background:rgba(8,28,45,.9); color:#dff3ff; border:1px solid rgba(120,200,255,.4); border-radius:10px; padding:9px 16px; font-size:14px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }

  /* ===== 移动端排行榜抽屉 ===== */
  @media (max-width:760px) {
    #leaderboard { top:auto; right:0; bottom:0; left:0; width:auto; border-radius:14px 14px 0 0; transform:translateY(calc(100% - 34px)); transition:transform .3s; }
    #leaderboard.open { transform:translateY(0); }
    #lbList { max-height:220px; }
    #lbHandle { display:block; text-align:center; color:#9cc9e6; font-size:12px; padding:2px; cursor:pointer; }
  }
  #lbHandle { display:none; }
  @media (min-width:761px) { #lbHandle { display:none; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cvs"></canvas>

  <div id="hud">
    <div class="chip">金币 <b id="hCoins">0</b></div>
    <div class="chip">得分 <b id="hScore">0</b></div>
    <div class="chip">最佳 <span class="lb" id="hBest">0</span></div>
    <div class="chip" id="hFishes">🐟 <b id="hCount">0</b> 条</div>
  </div>

  <div id="topBar">
    <button class="btn" id="btnSettings">⚙️ 设置</button>
    <button class="btn danger" id="btnExit">退出</button>
  </div>

  <div id="prompt"></div>
  <div id="subPrompt"></div>

  <div id="fight">
    <div id="fightLabel">保持拉力，别让鱼挣脱！</div>
    <div id="fightTrack"><div id="fightFill"></div><div id="fightMark"></div></div>
  </div>

  <div id="leaderboard">
    <div id="lbHandle" onclick="toggleLB()">▲ 实时排行榜（点此展开/收起）</div>
    <div id="lbHead">
      <span class="t">🏆 实时排行榜</span>
      <span id="lbLive">● 实时</span>
    </div>
    <div id="lbList"></div>
    <div id="lbEmpty" style="display:none;">暂无数据，配置 Token 后自动刷新</div>
  </div>

  <div id="settingsOverlay">
    <div id="settingsBox">
      <h2>⚙️ 游戏设置</h2>
      <div class="sub">配置玩家名与 GitHub Token，实现云端自动存档与排行榜</div>
      <label>玩家名（用于存档文件夹 Game5Saves/&lt;玩家名&gt;）</label>
      <input id="inpUser" type="text" placeholder="例如 lh3778" autocomplete="off">
      <label>GitHub Token（需对该仓库有 Contents 读写权限）</label>
      <input id="inpToken" type="password" placeholder="ghp_xxxxxxxx" autocomplete="off">
      <div class="row">
        <button class="btn primary" onclick="saveSettings()">保存配置</button>
        <button class="btn" onclick="saveNow()">立即保存存档</button>
      </div>
      <div class="row">
        <button class="btn" onclick="loadCloud()">从云端恢复</button>
        <button class="btn" onclick="refreshLB()">刷新排行榜</button>
      </div>
      <div id="setNote"></div>
      <div class="tip">Token 仅保存在你浏览器本地（localStorage）。存档写入仓库 Game5Saves/玩家名/save.json，排行榜写入 Game1Data/leaderboard.json。</div>
      <div class="row"><button class="btn" onclick="closeSettings()">关闭</button></div>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(function(){
"use strict";
/* ================= 元素 ================= */
var $=function(id){return document.getElementById(id);};
var cvs=$('cvs'), ctx=cvs.getContext('2d');
var hCoins=$('hCoins'), hScore=$('hScore'), hBest=$('hBest'), hCount=$('hCount');
var promptEl=$('prompt'), subEl=$('subPrompt'), fightEl=$('fight'), fightFill=$('fightFill');
var lbList=$('lbList'), lbEmpty=$('lbEmpty'), lbLive=$('lbLive');
var toastEl=$('toast');
var W=0,H=0,DPR=1;

/* ================= 配置与存档 ================= */
var LS_USER='game1_user', LS_TOKEN='game1_token';
var API_BASE='https://api.github.com/repos/YunYu-ca/YunYu-ca.github.io';
var SAVE_PATH='Game5Saves';          // 与 Game5 共用存档文件夹
var LB_PATH='Game1Data/leaderboard.json';

var cfg={user:'',token:''};
try{ cfg.user=localStorage.getItem(LS_USER)||''; cfg.token=localStorage.getItem(LS_TOKEN)||''; }catch(e){}

/* 玩家数据 */
var P={ coins:0, score:0, best:0, catches:0, rareFish:0 };
var dirty=false;

function saveSettings(){
  var u=$('inpUser').value.trim(), t=$('inpToken').value.trim();
  if(!u){ note('请填写玩家名'); return; }
  cfg.user=u; cfg.token=t;
  try{ if(t)localStorage.setItem(LS_TOKEN,t); localStorage.setItem(LS_USER,u); }catch(e){}
  note(u+'：配置已保存'+(t?'，Token 已写入本地':'，但未填 Token'));
  if(t) refreshLB();
}
function closeSettings(){ $('settingsOverlay').classList.remove('show'); }
function note(msg){ $('setNote').textContent=msg; }
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){toastEl.classList.remove('show');},2400); }

/* GitHub Contents API 读写 */
function ghHeaders(extra){
  var h={'Accept':'application/vnd.github+json','Content-Type':'application/json'};
  if(cfg.token) h['Authorization']='Bearer '+cfg.token;
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function ghGet(path){
  return fetch(API_BASE+'/contents/'+path, {headers:ghHeaders()})
    .then(function(r){ if(r.status===404) return null; if(!r.ok) throw new Error('GET '+r.status); return r.json(); });
}
function ghPut(path,content,sha){
  var body={message:'[游戏自动存档] '+cfg.user+' '+new Date().toISOString(),content:content};
  if(sha) body.sha=sha;
  return fetch(API_BASE+'/contents/'+path,{method:'PUT',headers:ghHeaders(),body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error('PUT '+r.status); return r.json(); });
}
function b64(s){ try{ return btoa(unescape(encodeURIComponent(s))); }catch(e){ return btoa(s); } }
function unb64(s){ try{ return decodeURIComponent(escape(atob(s))); }catch(e){ return atob(s); } }

function packSave(){ return { username:cfg.user, savedAt:new Date().toISOString(), bestScore:P.best, totalScore:P.score, coins:P.coins, totalCatches:P.catches, rareFish:P.rareFish }; }

/* 保存当前玩家存档到 Game5Saves/玩家名/save.json */
function pushSave(){
  if(!cfg.user||!cfg.token){ return Promise.reject(new Error('未配置玩家名或 Token')); }
  var path=SAVE_PATH+'/'+encodeURIComponent(cfg.user)+'/save.json';
  var data=packSave();
  return ghGet(path).then(function(ex){
    var sha = (ex && ex.sha) ? ex.sha : undefined;
    return ghPut(path, b64(JSON.stringify(data,null,2)), sha);
  }).then(function(){ dirty=false; return true; });
}
function saveNow(){
  if(!cfg.user||!cfg.token){ note('请先配置玩家名与 Token'); return; }
  note('正在保存…');
  pushSave().then(function(){ note('✅ 已保存到 Game5Saves/'+cfg.user+'/save.json'); toast('存档已保存'); })
    .catch(function(e){ note('保存失败：'+e.message); toast('保存失败：'+e.message); });
}
function loadCloud(){
  if(!cfg.user||!cfg.token){ note('请先配置玩家名与 Token'); return; }
  note('正在从云端恢复…');
  ghGet(SAVE_PATH+'/'+encodeURIComponent(cfg.user)+'/save.json')
    .then(function(ex){
      if(!ex) throw new Error('云端没有该玩家存档');
      var d=JSON.parse(unb64(ex.content));
      P.coins=d.coins||0; P.score=d.totalScore||0; P.best=d.bestScore||0;
      P.catches=d.totalCatches||0; P.rareFish=d.rareFish||0;
      syncHUD(); dirty=false;
      note('✅ 已恢复 '+cfg.user+' 的云端存档'); toast('云端存档已恢复');
    }).catch(function(e){ note('恢复失败：'+e.message); toast('恢复失败：'+e.message); });
}

/* 排行榜：Game1Data/leaderboard.json（top50 by best） */
function loadLB(){
  return ghGet(LB_PATH).then(function(ex){
    if(!ex) return [];
    var arr=JSON.parse(unb64(ex.content));
    return Array.isArray(arr)?arr:[];
  });
}
function writeLB(arr){
  return ghGet(LB_PATH).then(function(ex){
    var sha=(ex&&ex.sha)?ex.sha:undefined;
    return ghPut(LB_PATH, b64(JSON.stringify(arr,null,2)), sha);
  });
}
var lbThrottle=0;
function updateLB(){
  var now=Date.now();
  if(now-lbThrottle<10000) return;   // 收杆后 10 秒节流
  if(!cfg.user||!cfg.token) return;
  lbThrottle=now;
  loadLB().then(function(arr){
    var self={name:cfg.user, best:P.best};
    var found=false;
    for(var i=0;i<arr.length;i++){ if(arr[i].name===cfg.user){ arr[i].best=Math.max(arr[i].best||0,self.best); found=true; break; } }
    if(!found) arr.push(self);
    arr.sort(function(a,b){ return (b.best||0)-(a.best||0); });
    arr=arr.slice(0,50);
    return writeLB(arr);
  }).then(function(){ lbLive.textContent='● 实时'; lbLive.classList.remove('off'); refreshLB(); })
    .catch(function(e){ lbLive.textContent='● 连接异常'; lbLive.classList.add('off'); });
}
function refreshLB(){
  if(!cfg.user||!cfg.token){ lbEmpty.style.display='block'; lbEmpty.textContent='配置 Token 后自动刷新排行榜'; lbList.innerHTML=''; return; }
  loadLB().then(function(arr){
    if(!arr.length){ lbEmpty.style.display='block'; lbEmpty.textContent='暂无数据，钓到鱼后会自动写入'; lbList.innerHTML=''; return; }
    lbEmpty.style.display='none';
    var html=''; var me=cfg.user;
    var top=arr.slice(0,50);
    for(var i=0;i<top.length;i++){
      var r=top[i], isMe=(r.name===me);
      html+='<div class="lb-row'+(i<3?' top':'')+(isMe?' me':'')+'">'+
            '<span class="rk">'+(i+1)+'</span>'+
            '<span class="nm">'+(isMe?'⭐ ':'')+esc(r.name)+'</span>'+
            '<span class="sc">'+(r.best||0)+'</span></div>';
    }
    lbList.innerHTML=html;
  }).catch(function(e){ lbLive.textContent='● 读取失败'; lbLive.classList.add('off'); });
}
function esc(s){ return String(s).replace(/[<>&"]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];}); }

/* ================= 鱼种 ================= */
var FISH=[
  {name:'小麦穗',emoji:'🐟',value:12,wMin:40,wMax:120,rare:0},
  {name:'鲫鱼',  emoji:'🐠',value:22,wMin:120,wMax:400,rare:0},
  {name:'鲈鱼',  emoji:'🐡',value:40,wMin:300,wMax:1200,rare:0},
  {name:'鲤鱼',  emoji:'🐋',value:65,wMin:600,wMax:2500,rare:0},
  {name:'锦鲤',  emoji:'🐬',value:120,wMin:800,wMax:3000,rare:1},
  {name:'金龙·龙鲤',emoji:'🐉',value:300,wMin:1500,wMax:5000,rare:2}
];
function randFish(){
  var r=Math.random();
  var idx;
  if(r<0.38) idx=0; else if(r<0.66) idx=1; else if(r<0.86) idx=2;
  else if(r<0.97) idx=3; else if(r<0.995) idx=4; else idx=5;
  return FISH[idx];
}

/* ================= 状态机 ================= */
var ST={IDLE:0,CHARGING:1,FLYING:2,WAITING:3,BITING:4,REELING:5,RESULT:6};
var st=ST.IDLE;
var power=0, aimX=0.5;               // 蓄力 / 横向瞄准 0..1
var bob={x:0,y:0,t:0,phase:0,landed:false};   // 浮漂
var lineFrom={x:0,y:0};
var currentFish=null;
var fight={v:50,target:50,active:false};     // 收线对抗 0..100
var resultTimer=0, catchFish=null;
var biteAt=0;
var rAF=0, last=0;

/* ================= 输入 ================= */
function pressStart(e){
  e.preventDefault();
  if(st===ST.IDLE){ st=ST.CHARGING; power=0; }
  else if(st===ST.WAITING){ startHook(); }
  else if(st===ST.BITING){ startHook(); }
}
function pressMove(e){
  var rect=cvs.getBoundingClientRect();
  var x=(e.clientX!==undefined?e.clientX:e.touches[0].clientX)-rect.left;
  aimX=Math.max(0,Math.min(1,x/rect.width));
}
function pressEnd(e){
  e.preventDefault();
  if(st===ST.CHARGING){ cast(); }
}
cvs.addEventListener('mousedown',pressStart);
cvs.addEventListener('mousemove',pressMove);
window.addEventListener('mouseup',pressEnd);
cvs.addEventListener('touchstart',pressStart,{passive:false});
cvs.addEventListener('touchmove',pressMove,{passive:false});
window.addEventListener('touchend',pressEnd);
window.addEventListener('keydown',function(e){
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); if(st===ST.IDLE){st=ST.CHARGING;power=0;} else if(st===ST.WAITING||st===ST.BITING){startHook();} }
});
window.addEventListener('keyup',function(e){
  if(e.code==='Space'||e.code==='Enter'){ if(st===ST.CHARGING) cast(); }
});

/* ================= 玩法动作 ================= */
function cast(){
  var p=Math.min(1,Math.max(0.12,power));
  var rect=cvs.getBoundingClientRect();
  // 浮漂落点：由横向瞄准 + 蓄力决定距离
  var dist=0.30+0.5*p;
  var bx=aimX*W;
  var by=H*(0.52+0.10*(1-p));       // 蓄力越大落得越远（水面更深处）
  // 简化：让距离基于蓄力，落点在视野水面
  var targetY=H*0.40 + dist*H*0.55;
  bob.x=bx; bob.y=Math.min(targetY,H*0.86); bob.phase=0; bob.landed=false;
  lineFrom={x:W*0.5,y:H*0.28};
  bob.t=0;
  st=ST.FLYING;
  promptEl.textContent=''; subEl.textContent='';
  setTimeout(function(){ if(st===ST.FLYING){ bob.landed=true; st=ST.WAITING; promptEl.textContent='等待鱼儿咬钩…'; subEl.textContent='浮漂下沉时点击收竿！'; promptEl.classList.add('show'); subEl.classList.add('show'); scheduleBite(); } }, 700);
}
function scheduleBite(){
  setTimeout(function(){
    if(st!==ST.WAITING) return;
    currentFish=randFish();
    st=ST.BITING; biteAt=Date.now();
    promptEl.textContent='拉竿！'+currentFish.emoji+' 上钩了！';
    subEl.textContent='快点击 / 按空格收竿！';
  }, 1800+Math.random()*3600);
}
function startHook(){
  if(st!==ST.WAITING&&st!==ST.BITING) return;
  if(st===ST.WAITING){
    // 抢竿：小概率空钩
    promptEl.textContent='空钩……再等等';
    subEl.textContent='';
    st=ST.IDLE;
    setTimeout(function(){ promptEl.classList.remove('show'); subEl.classList.remove('show'); },900);
    return;
  }
  // 进入收线对抗
  st=ST.REELING;
  fight.v=55; fight.target=55; fight.active=true;
  fightEl.classList.add('show');
  promptEl.textContent='和'+currentFish.name+'拔河！';
  subEl.textContent='按住/点击收线，松手让鱼挣扎';
  fightFill.style.width=fight.v+'%';
}
function finishHook(ok){
  st=ST.RESULT; resultTimer=0;
  fightEl.classList.remove('show');
  if(ok){
    var f=currentFish;
    var w=Math.round(f.wMin+Math.random()*(f.wMax-f.wMin));
    var pts=Math.round(f.value*(0.8+Math.random()*0.4));
    P.coins+=f.value; P.score+=pts; P.catches+=1;
    if(f.rare>0) P.rareFish+=1;
    if(P.score>P.best) P.best=P.score;
    catchFish={name:f.name,emoji:f.emoji,w:w,pts:pts,rare:f.rare};
    promptEl.textContent='🎣 钓到 '+f.emoji+' '+f.name+'（'+w+'g）！ +'+pts;
    subEl.textContent='金币 +'+f.value;
    dirty=true;
    syncHUD();
    updateLB();
  } else {
    catchFish=null;
    promptEl.textContent='鱼挣脱了……';
    subEl.textContent='';
  }
  promptEl.classList.add('show'); subEl.classList.add('show');
  currentFish=null;
}

/* ================= 更新循环 ================= */
function update(dt){
  // 蓄力
  if(st===ST.CHARGING){ power=Math.min(1,power+dt*1.4); }
  // 浮漂在飞行/水上
  if(st===ST.FLYING||st===ST.WAITING||st===ST.BITING){
    bob.phase+=dt*2.4;
    bob.t+=dt;
  }
  // 咬钩窗口：2.5 秒内没收竿→回到等待
  if(st===ST.BITING && Date.now()-biteAt>2500){
    st=ST.WAITING; currentFish=null;
    promptEl.textContent='鱼儿跑了，继续等待…';
    scheduleBite();
  }
  // 收线对抗
  if(st===ST.REELING && fight.active){
    // 鱼挣扎：向 0 下拉
    fight.v -= dt*9;
    // 玩家按住收线
    if(pressing) fight.v += dt*20;
    fight.v=Math.max(0,Math.min(100,fight.v));
    fightFill.style.width=fight.v+'%';
    if(fight.v>=100){ finishHook(true); }
    else if(fight.v<=0){ finishHook(false); }
  }
  // 结果停留
  if(st===ST.RESULT){
    resultTimer+=dt;
    if(resultTimer>2.2){ st=ST.IDLE; promptEl.classList.remove('show'); subEl.classList.remove('show'); catchFish=null; }
  }
}
var pressing=false;
window.addEventListener('mousedown',function(){pressing=true;});
window.addEventListener('mouseup',function(){pressing=false;});
window.addEventListener('touchstart',function(){pressing=true;},{passive:true});
window.addEventListener('touchend',function(){pressing=false;},{passive:true});

/* ================= 渲染（第一人称） ================= */
function draw(t){
  var w=W,h=H;
  // 天空
  var sky=ctx.createLinearGradient(0,0,0,h*0.55);
  sky.addColorStop(0,'#3f8fc0'); sky.addColorStop(0.5,'#bfe3f5'); sky.addColorStop(1,'#e8f7ff');
  ctx.fillStyle=sky; ctx.fillRect(0,0,w,h*0.55);
  // 太阳
  ctx.globalAlpha=0.95;
  var sx=w*0.82, sy=h*0.12, sr=Math.min(w,h)*0.05;
  var glow=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*3);
  glow.addColorStop(0,'rgba(255,240,190,0.9)'); glow.addColorStop(1,'rgba(255,240,190,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(sx,sy,sr*3,0,6.283); ctx.fill();
  ctx.fillStyle='#fff3c4'; ctx.beginPath(); ctx.arc(sx,sy,sr,0,6.283); ctx.fill();
  // 云
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(var i=0;i<4;i++){
    var cx=((w*0.2+i*0.24*w)+t*8)%(w+200)-100;
    var cy=h*(0.07+i*0.06);
    ellipse(cx,cy,44,16);
    ellipse(cx+22,cy-8,30,12);
    ellipse(cx-22,cy+2,26,10);
  }
  // 远山
  ctx.fillStyle='#7fb39a';
  ctx.beginPath(); ctx.moveTo(0,h*0.42);
  for(var mx=0;mx<=w;mx+=w/24){ ctx.lineTo(mx,h*(0.42+0.05*Math.abs(Math.sin(mx*0.003+1.2)))); }
  ctx.lineTo(w,h*0.44); ctx.lineTo(0,h*0.44); ctx.closePath(); ctx.fill();
  // 水面
  var wGrad=ctx.createLinearGradient(0,h*0.45,0,h);
  wGrad.addColorStop(0,'#2e7ea8'); wGrad.addColorStop(0.6,'#1d5f86'); wGrad.addColorStop(1,'#12384f');
  ctx.fillStyle=wGrad; ctx.fillRect(0,h*0.45,w,h*0.55);
  // 水波
  ctx.strokeStyle='rgba(255,255,255,0.18)'; ctx.lineWidth=1.4;
  for(var wi=0;wi<9;wi++){
    var y=h*(0.48+wi*0.05);
    ctx.beginPath();
    for(var wx=0;wx<=w;wx+=10){
      var yy=y+Math.sin((wx*0.02+wi)+t*(1+wi*0.3))*3;
      if(wx===0) ctx.moveTo(wx,yy); else ctx.lineTo(wx,yy);
    }
    ctx.stroke();
  }
  // 浮漂（在水面）
  if(st!==ST.IDLE && st!==ST.CHARGING){
    var bY=bob.y, dip=0;
    if(st===ST.BITING){ dip=18*Math.abs(Math.sin(bob.phase*6)); }
    else if(st===ST.WAITING){ dip=3*Math.sin(bob.phase*3); }
    var bY2=bY+dip;
    // 水面倒影涟漪
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(bob.x,bY,22,0,6.283); ctx.stroke();
    ctx.beginPath(); ctx.arc(bob.x,bY,34,0,6.283); ctx.stroke();
    // 浮漂本体
    ctx.fillStyle='#ff5a3c'; ctx.beginPath(); ctx.arc(bob.x,bY2-5,7,0,6.283); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(bob.x,bY2-5,3,0,6.283); ctx.fill();
    ctx.strokeStyle='#ff5a3c'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(bob.x,bY2-5); ctx.lineTo(bob.x,bY2-13); ctx.stroke();
  }
  // 鱼线：从竿尖到浮漂
  if(st===ST.FLYING||st===ST.WAITING||st===ST.BITING||st===ST.REELING){
    ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(lineFrom.x,lineFrom.y);
    ctx.quadraticCurveTo(W*0.5,H*0.35,bob.x,bob.y-5);
    ctx.stroke();
  }
  // 第一人称：岸堤 + 手 + 鱼竿
  drawDockAndRod(h);

  // 收线时显示鱼在水面扑腾
  if(st===ST.REELING && currentFish){
    ctx.font='26px sans-serif'; ctx.textAlign='center';
    var fx=bob.x+Math.sin(t*14)*14, fy=bob.y-20;
    ctx.fillStyle='#fff'; ctx.shadowColor='rgba(0,0,0,0.5)'; ctx.shadowBlur=8;
    ctx.fillText(currentFish.emoji,fx,fy);
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
  // 蓄力指示
  if(st===ST.CHARGING){
    ctx.fillStyle='rgba(255,214,102,'+(0.25+0.5*power)+')';
    ctx.beginPath(); ctx.arc(W*0.5,H*0.30,10+power*40,0,6.283); ctx.fill();
    ctx.fillStyle='#ffd866'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('松手抛竿！',W*0.5,H*0.18);
  }
}
function ellipse(x,y,rx,ry){ ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,6.283); ctx.fill(); }
function drawDockAndRod(h){
  // 岸堤（下边缘第一人称木板）
  var dTop=h*0.86;
  var g=ctx.createLinearGradient(0,dTop,0,h);
  g.addColorStop(0,'#7d5636'); g.addColorStop(1,'#4a2f1a');
  ctx.fillStyle=g; ctx.fillRect(0,dTop,W,h-dTop);
  ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=2;
  for(var i=0;i<7;i++){ var y=dTop+6+i*((h-dTop-8)/7); ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  // 鱼竿（第一人称，从下方伸向水面）
  var handX=W*0.5, handY=h*0.95;
  var tipX=W*0.5, tipY=h*0.30;
  // 竿身
  ctx.strokeStyle='#3a2b1c'; ctx.lineWidth=9; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(handX,handY); ctx.quadraticCurveTo(handX+30,handY-120,tipX+40,tipY); ctx.stroke();
  ctx.strokeStyle='#6b4a2f'; ctx.lineWidth=5;
  ctx.beginPath(); ctx.moveTo(handX,handY); ctx.quadraticCurveTo(handX+30,handY-120,tipX+40,tipY); ctx.stroke();
  // 手（简单剪影）
  ctx.fillStyle='#c98a4b';
  ctx.beginPath(); ctx.arc(handX-4,handY-6,15,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(handX+16,handY-4,14,0,6.283); ctx.fill();
  // 竿尖位置更新为世界坐标供鱼线使用
  lineFrom={x:tipX+40,y:tipY};
}

/* ================= 主循环 ================= */
function loop(ts){
  var dt=Math.min(0.05,(ts-last)/1000); last=ts;
  update(dt);
  draw(ts/1000);
  rAF=requestAnimationFrame(loop);
}
function resize(){
  DPR=window.devicePixelRatio||1;
  W=window.innerWidth; H=window.innerHeight;
  cvs.width=W*DPR; cvs.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  aimX=0.5;
}
window.addEventListener('resize',resize);

/* ================= HUD ================= */
function syncHUD(){
  hCoins.textContent=fmt(P.coins);
  hScore.textContent=fmt(P.score);
  hBest.textContent=fmt(P.best);
  hCount.textContent=P.catches;
}
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,','); }

/* ================= 退出确认（用户锁定口径） ================= */
function doExit(){ location.href='https://yunyu-ca.github.io/Game.html'; }
function confirmExit(){
  var ok=window.confirm('是否确定保存存档？');
  if(ok){
    if(cfg.token&&cfg.user){
      pushSave().then(function(){ doExit(); }).catch(function(e){ alert('网络错误，保存失败'); });
    } else {
      doExit();
    }
  } else {
    var ok2=window.confirm('是否确定不保存？未保存的进度将丢失');
    if(ok2){
      alert('当前存档记录将不会被保存');
      doExit();
    }
    // 否则留在游戏
  }
}
$('btnExit').addEventListener('click',function(e){ e.stopPropagation(); confirmExit(); });
$('btnSettings').addEventListener('click',function(e){ e.stopPropagation(); openSettings(); });
function openSettings(){
  $('inpUser').value=cfg.user;
  $('inpToken').value=cfg.token;
  $('settingsOverlay').classList.add('show');
}
function toggleLB(){ $('leaderboard').classList.toggle('open'); }

// beforeunload 尽力而为（浏览器可能拦截弹窗）
window.addEventListener('beforeunload',function(e){
  if(dirty && cfg.user && cfg.token){
    try{
      var ok=window.confirm('是否确定保存存档？');
      if(ok){ pushSave(); }
      else{
        var ok2=window.confirm('是否确定不保存？未保存的进度将丢失');
        if(ok2){ alert('当前存档记录将不会被保存'); }
        else{ e.preventDefault(); e.returnValue=''; }
      }
    }catch(err){}
  }
});

/* ================= 启动 ================= */
resize();
requestAnimationFrame(function(ts){ last=ts; rAF=requestAnimationFrame(loop); });
$('inpUser').value=cfg.user; $('inpToken').value=cfg.token;
if(cfg.user) refreshLB();
promptEl.textContent='第一人称钓鱼乐园 · 点击蓄力抛竿';
subEl.textContent='按住瞄准 + 蓄力，松手抛出，浮漂下沉即收竿';
promptEl.classList.add('show'); subEl.classList.add('show');
setTimeout(function(){ promptEl.classList.remove('show'); subEl.classList.remove('show'); },2600);
})();
</script>
