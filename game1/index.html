<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>钓鱼乐园 Fishing Paradise</title>
<style>
  :root{
    --bg:#0b1b2b; --panel:#11283d; --panel2:#0d2032; --line:#7fd1ff;
    --gold:#ffd76a; --txt:#e8f4ff; --muted:#8fb3cc; --danger:#ff6b6b;
    --ok:#7ee0a3;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 600px at 50% -10%, #163a57, #0b1b2b 70%);
    color:var(--txt);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  #app{display:flex; flex-direction:column; height:100%;}
  header{
    display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:rgba(10,26,40,.85); border-bottom:1px solid #1c3a55;
  }
  .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px;}
  .logo .fish{font-size:22px;}
  .grow{flex:1;}
  .hud{display:flex; gap:14px; font-size:13px;}
  .hud b{color:var(--gold);}
  .btn{
    border:1px solid #2c5578; background:linear-gradient(#1a3b58,#122c42);
    color:var(--txt); padding:6px 14px; border-radius:8px; cursor:pointer;
    font-size:13px; transition:.15s;
  }
  .btn:hover{background:#1d4362; border-color:#3a6b96;}
  .btn.primary{background:linear-gradient(#0f7a54,#0a5c3f); border-color:#1aa06c;}
  .btn.danger{background:linear-gradient(#7a2430,#591b22); border-color:#a33;}
  .btn.ghost{background:transparent; border-color:#24425f;}
  .iconbtn{
    width:36px; height:36px; border-radius:8px; border:1px solid #2c5578;
    background:#122c42; color:var(--txt); font-size:18px; cursor:pointer; line-height:1;
  }
  #wrap{flex:1; display:flex; position:relative; min-height:0;}
  #stage{flex:1; position:relative; min-width:0;}
  canvas{display:block; width:100%; height:100%;}
  /* HUD overlays on stage */
  .pill{
    position:absolute; top:12px; padding:6px 12px; border-radius:20px;
    background:rgba(8,22,36,.75); border:1px solid #1f4160; font-size:13px;
  }
  #baitPill{left:12px;}
  #bestPill{right:12px;}
  #leaderboard{
    width:300px; background:rgba(9,22,36,.94); border-left:1px solid #1f4160;
    display:flex; flex-direction:column; overflow:hidden;
  }
  #lbHead{padding:12px 14px; font-weight:800; border-bottom:1px solid #1f4160; display:flex; align-items:center; gap:8px;}
  #lbHead .live{color:var(--ok); font-size:11px; font-weight:600;}
  #lbList{flex:1; overflow-y:auto; padding:8px;}
  .lbRow{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; margin-bottom:4px;}
  .lbRow.me{background:#1a3f2c; border:1px solid #2e7d54;}
  .lbRow:not(.me){background:#0d2032; border:1px solid #17324b;}
  .lbRank{width:24px; text-align:center; font-weight:800; color:var(--gold);}
  .lbRank.g1{color:#ffd700}.lbRank.g2{color:#c0c0c0}.lbRank.g3{color:#cd7f32}
  .lbName{flex:1; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lbScore{font-weight:800; color:var(--gold);}
  .lbStat{font-size:11px; color:var(--muted); margin-left:6px;}
  #lbEmpty{color:var(--muted); font-size:13px; padding:16px; text-align:center;}
  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(3,10,18,.72); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:16px;
  }
  .overlay.open{display:flex;}
  .modal{
    width:min(460px,100%); background:var(--panel); border:1px solid #2a4c6d; border-radius:14px;
    padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal h3{font-size:17px; margin-bottom:16px; display:flex; align-items:center; gap:8px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px;}
  .field input{
    width:100%; padding:9px 12px; border-radius:8px; border:1px solid #2c5578;
    background:#0a1a2a; color:var(--txt); font-size:14px;
  }
  .field input:focus{outline:none; border-color:var(--line);}
  .field .hint{font-size:11px; color:var(--muted); margin-top:5px; line-height:1.5;}
  .row{display:flex; gap:10px; margin-top:6px;}
  .row .btn{flex:1;}
  .note{font-size:11px; color:var(--muted); margin-top:12px; line-height:1.6;}
  /* bite prompt */
  #prompt{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
    display:none; font-size:20px; font-weight:900; color:#fff; text-shadow:0 0 12px #ff9; z-index:20;
  }
  #prompt .go{color:#ffd76a;}
  #prompt.show{display:block; animation:pulse .5s infinite alternate;}
  @keyframes pulse{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) scale(1.08)}}
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:80;
    background:rgba(8,22,36,.95); border:1px solid #2a5578; padding:10px 18px; border-radius:20px;
    font-size:13px; opacity:0; transition:opacity .3s; pointer-events:none; max-width:90vw; text-align:center;
  }
  #toast.show{opacity:1;}
  @media(max-width:760px){ #leaderboard{width:100%; position:absolute; right:0; top:0; bottom:0; z-index:30; transform:translateX(100%); transition:.25s;} #leaderboard.open{transform:none;} #lbToggle{display:block!important;} }
  #lbToggle{display:none;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="fish">🐟</span><span>钓鱼乐园</span></div>
    <div class="grow"></div>
    <div class="hud">
      <span>🪙 <b id="hCoins">0</b></span>
      <span>🐠 <b id="hScore">0</b></span>
      <span>最佳 <b id="hBest">0</b></span>
    </div>
    <button class="btn ghost" id="lbToggle" onclick="toggleLB()">🏆 排行</button>
    <button class="btn" onclick="openSettings()">⚙️ 设置</button>
    <button class="btn danger" onclick="handleExit()">退出</button>
  </header>

  <div id="wrap">
    <div id="stage">
      <canvas id="cvs"></canvas>
      <div class="pill" id="baitPill">🎣 鱼饵：<b id="baitNum">∞</b></div>
      <div class="pill" id="bestPill" style="display:none">🏆 最高分 <b id="bestNum">0</b></div>
      <div id="prompt"><span class="go">咬钩了！</span><br>快收杆！</div>
    </div>

    <aside id="leaderboard">
      <div id="lbHead">🏆 实时排行榜 <span class="live" id="lbLive">● 连接中</span></div>
      <div id="lbList"><div id="lbEmpty">配置 GitHub Token 后即可查看/更新排行榜</div></div>
    </aside>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>⚙️ 设置</h3>
    <div class="field">
      <label>玩家名（用于存档到 Game5Saves/{玩家名}/save.json）</label>
      <input id="inpUser" placeholder="输入一个玩家名，如 lh3778">
    </div>
    <div class="field">
      <label>GitHub Token（用于自动存档到本仓库）</label>
      <input id="inpToken" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off">
      <div class="hint">Token 只存在你的浏览器 localStorage，用于把存档/排行榜写进 YunYu-ca.github.io 仓库（需对仓库有 Contents 读写权限）。<b>请勿在公共设备上使用。</b></div>
    </div>
    <div class="row">
      <button class="btn primary" onclick="saveConfig()">保存配置</button>
      <button class="btn" onclick="pushSave()">立即保存存档</button>
      <button class="btn" onclick="pullSave()">从云端恢复</button>
    </div>
    <div class="row">
      <button class="btn" onclick="refreshLB()">刷新排行榜</button>
      <button class="btn" onclick="closeSettings()">关闭</button>
    </div>
    <div class="note" id="setNote">当前状态：未配置 Token / 未登录</div>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ================= 常量 ================= */
const REPO_OWNER = "YunYu-ca", REPO_NAME = "YunYu-ca.github.io";
const REPO = REPO_OWNER + "/" + REPO_NAME;
const ARCADE = "https://" + REPO_OWNER + ".github.io/Game.html";
const LS_USER = "game1_user", LS_TOKEN = "game1_token";
const LB_PATH = "Game1Data/leaderboard.json";       // 排行榜文件
const savePath = u => "Game5Saves/" + encodeURIComponent(u) + "/save.json"; // 存档文件（与 Game5 同文件夹）

/* ================= 玩家状态 ================= */
const player = {
  username: "", best: 0, score: 0, coins: 0, catches: 0, rare: 0, updatedAt: null
};
let dirty = false;          // 是否有未保存的进度

/* ================= GitHub API（Token 直连） ================= */
function getToken(){ return localStorage.getItem(LS_TOKEN) || ""; }
function getUser(){ return localStorage.getItem(LS_USER) || ""; }
function hasAuth(){ return !!getToken() && !!getUser(); }
function b64(s){ return btoa(unescape(encodeURIComponent(s))); }
async function gh(method, path, body){
  const token = getToken();
  if(!token) throw new Error("未配置 Token");
  const res = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, {
    method,
    headers: {
      "Authorization": "Bearer " + token,
      "Accept": "application/vnd.github+json",
      "Content-Type": "application/json",
      "X-GitHub-Api-Version": "2022-11-28"
    },
    body: body ? JSON.stringify(body) : undefined
  });
  return res;
}
async function readGH(path){
  const res = await gh("GET", path);
  if(res.status === 404) return null;
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error("读取失败: " + (e.message || res.status)); }
  const j = await res.json();
  return { content: decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))), sha: j.sha };
}
async function writeGH(path, content){
  let sha;
  const ex = await gh("GET", path);
  if(ex.status === 200){ sha = (await ex.json()).sha; }
  else if(ex.status !== 404){ const e = await ex.json().catch(()=>({})); throw new Error("写入失败: " + (e.message || ex.status)); }
  const res = await gh("PUT", path, { message: "Game1 save " + path, content: b64(content), ...(sha ? { sha } : {}) });
  if(!res.ok){ const e = await res.json().catch(()=>({})); throw new Error("写入失败: " + (e.message || res.status)); }
  return res;
}

/* ================= 存档 ================= */
function playerSnapshot(){
  return {
    username: player.username, savedAt: new Date().toISOString(),
    bestScore: player.best, totalScore: player.score, coins: player.coins,
    totalCatches: player.catches, rareFish: player.rare
  };
}
async function pushSave(){  // 写 Game5Saves/{user}/save.json + 更新排行榜
  if(!hasAuth()){ toast("请先在设置里配置玩家名和 Token"); return false; }
  player.username = getUser(); player.updatedAt = new Date().toISOString();
  try{
    await writeGH(savePath(player.username), JSON.stringify(playerSnapshot(), null, 2));
    await pushLeaderboard();
    dirty = false;
    toast("✅ 存档已保存到 Game5Saves/" + player.username + "/save.json");
    return true;
  }catch(e){ toast("❌ 保存失败：" + e.message); return false; }
}
async function pullSave(){
  if(!hasAuth()){ toast("请先在设置里配置玩家名和 Token"); return; }
  player.username = getUser();
  try{
    const f = await readGH(savePath(player.username));
    if(!f){ toast("云端还没有这个玩家的存档"); return; }
    const d = JSON.parse(f.content);
    Object.assign(player, { best:d.bestScore||0, score:d.totalScore||0, coins:d.coins||0, catches:d.totalCatches||0, rare:d.rareFish||0 });
    refreshHUD();
    toast("✅ 已从云端恢复存档");
  }catch(e){ toast("❌ 恢复失败：" + e.message); }
}

/* ================= 排行榜 ================= */
let lbTimer = null;
async function readLeaderboard(){
  const f = await readGH(LB_PATH);
  if(!f) return [];
  const d = JSON.parse(f.content || "[]");
  return Array.isArray(d) ? d : (Array.isArray(d.entries) ? d.entries : []);
}
async function pushLeaderboard(){
  const token = getToken(); if(!token) return;
  let list;
  try{ list = await readLeaderboard(); }catch(e){ list = []; }
  const mine = {
    username: player.username, best: player.best, score: player.score,
    coins: player.coins, catches: player.catches, rare: player.rare, updatedAt: new Date().toISOString()
  };
  const i = list.findIndex(x => x.username === player.username);
  if(i >= 0) list[i] = mine; else list.push(mine);
  list.sort((a,b) => (b.best - a.best) || (b.score - a.score));
  await writeGH(LB_PATH, JSON.stringify(list.slice(0, 50)));
  renderLB(list);
  lbLive("● 在线");
}
async function refreshLB(){
  if(!getToken()){ renderLB([]); lbLive("● 未连接"); return; }
  try{
    const list = await readLeaderboard();
    renderLB(list); lbLive("● 在线");
  }catch(e){ toast("排行榜读取失败：" + e.message); lbLive("● 离线"); }
}
function renderLB(list){
  const el = document.getElementById("lbList");
  if(!list || !list.length){ el.innerHTML = '<div id="lbEmpty">暂无排行数据</div>'; return; }
  let html = "";
  list.slice(0,20).forEach((x,i)=>{
    const me = x.username === player.username ? " me" : "";
    const cls = "lbRank" + (i<3 ? " g"+(i+1) : "");
    html += '<div class="lbRow'+me+'"><span class="lbRank '+cls+'">'+(i+1)+'</span>' +
            '<span class="lbName">'+(x.username || "?")+'</span>' +
            '<span class="lbScore">'+fmt(x.best)+'</span>' +
            '<span class="lbStat">🐠'+fmt(x.score||0)+' · 🪙'+fmt(x.coins||0)+'</span></div>';
  });
  el.innerHTML = html;
}
function lbLive(t){ const s = document.getElementById("lbLive"); if(s) s.textContent = t; }
function fmt(n){ n = +n||0; return n.toLocaleString(); }

/* ================= 钓鱼玩法（Canvas） ================= */
const cvs = document.getElementById("cvs"), ctx = cvs.getContext("2d");
let W=0, H=0, waterY=0;
const fishTypes = [
  {name:"小鱼", val:10, w:0.5,  color:"#7fc4e8"},
  {name:"鲫鱼", val:20, w:0.3,  color:"#a9cfa0"},
  {name:"鲈鱼", val:40, w:0.12, color:"#8fa9c9"},
  {name:"鲤鱼", val:70, w:0.05, color:"#e8b96a"},
  {name:"金鱼", val:120,w:0.02, color:"#ffd76a", rare:true},
  {name:"金龙", val:300,w:0.008,color:"#ff9c3f", rare:true, legendary:true}
];
let phase = "idle";         // idle | cast | waiting | bite | reel
let rod = { x:0, y:0, angle:0 };
let bobber = { x:0, y:0, sx:0, sx2:0 };
let castT = 0, waitT = 0, biteT = 0, reelT = 0;
let bitePrompt = false, catchResult = null, animT = 0;
let clouds = [], fishS = []; // 水中游鱼装饰
const rng = (a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
  const r = cvs.parentElement.getBoundingClientRect();
  W = Math.max(300, r.width); H = Math.max(300, r.height);
  cvs.width = W; cvs.height = H;
  waterY = H*0.62;
  rod.x = W*0.5; rod.y = H*0.97;
  initScenery();
}
function initScenery(){
  clouds = Array.from({length:4},()=>({x:rng(0,W), y:rng(15,70), s:rng(40,80), v:rng(.1,.3)}));
  fishS = Array.from({length:6},()=>({x:rng(0,W), y:rng(waterY+30, H-20), d:rng(.2,.6), dir:Math.random()<.5?-1:1, r:rng(5,9), c:["#4a6d8a","#5b8aa0","#6a9b8f"][Math.floor(rng(0,3))]}));
}
function cast(){
  if(phase!=="idle") return;
  phase="cast"; castT=0; bobber.sx = W*(rng(.22,.78)); bobber.sx2=bobber.sx+rng(-40,40);
  bobber.x=W/2; bobber.y=H*0.4; bitePrompt=false; catchResult=null;
}
function bite(){
  phase="bite"; biteT=0; bitePrompt=true;
}
function reel(){
  if(phase!=="bite") return;
  phase="reel"; reelT=0; bitePrompt=false;
  const p = rollFish();
  catchResult = p;
}
function rollFish(){
  let r=Math.random(), acc=0;
  for(const f of fishTypes){ acc+=f.w; if(r<=acc) return f; }
  return fishTypes[0];
}

function update(dt){
  animT += dt;
  // 云
  for(const c of clouds){ c.x += c.v*dt; if(c.x-W>c.s) c.x=-c.s; }
  // 水下游鱼
  for(const f of fishS){ f.x += f.dir*f.d*dt; if(f.x<-20)f.x=W+20; if(f.x>W+20)f.x=-20; }
  if(phase==="cast"){
    castT += dt;
    const p = clamp(castT/0.9,0,1);
    bobber.x = bobber.sx + (bobber.sx2-bobber.sx)*p;
    bobber.y = H*0.4 + (waterY-20-H*0.4)*p;
    if(p>=1){ phase="waiting"; waitT = rng(1.6,4.2); }
  }else if(phase==="waiting"){
    waitT -= dt;
    if(waitT<=0) bite();
  }else if(phase==="bite"){
    biteT += dt;
    if(biteT>3.2){ phase="idle"; bitePrompt=false; }  // 没来得及收杆，鱼跑了
  }else if(phase==="reel"){
    reelT += dt;
    bobber.y -= dt*90;
    if(reelT>0.7){ applyCatch(); phase="idle"; }
  }
}
function applyCatch(){
  const f = catchResult; if(!f) return;
  player.score += f.val; player.coins += f.val; player.catches += 1;
  if(f.rare) player.rare += 1;
  if(player.score > player.best) player.best = player.score;
  dirty = true;
  refreshHUD();
  toast(f.legendary ? ("🔥 钓到传说金龙！+" + f.val) : ("🐟 钓到" + f.name + "！+" + f.val));
  // 实时排行榜：收杆后节流更新（让榜单尽量实时）
  updateLBThrottled();
}
let lbLastPush = 0;
function updateLBThrottled(){
  const now = Date.now();
  if(now - lbLastPush < 10000) return;   // 10 秒节流
  lbLastPush = now;
  if(hasAuth()) pushLeaderboard().catch(()=>{});
}

function draw(){
  // 天空
  const sky = ctx.createLinearGradient(0,0,0,waterY);
  sky.addColorStop(0,"#5ba7d9"); sky.addColorStop(1,"#bfe3f5");
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,waterY);
  // 太阳
  ctx.fillStyle="rgba(255,240,180,.9)"; ctx.beginPath(); ctx.arc(W*0.82, H*0.14, 26, 0, 7); ctx.fill();
  // 远山
  ctx.fillStyle="#6aa0b8"; ctx.beginPath();
  ctx.moveTo(0,waterY); ctx.lineTo(W*0.25,waterY-70); ctx.lineTo(W*0.5,waterY-30); ctx.lineTo(W*0.78,waterY-60); ctx.lineTo(W,waterY-15); ctx.lineTo(W,waterY); ctx.closePath(); ctx.fill();
  // 云
  ctx.fillStyle="rgba(255,255,255,.7)";
  for(const c of clouds){ ctx.beginPath(); ctx.ellipse(c.x,c.y,c.s,c.s*0.35,0,0,7); ctx.fill(); ctx.beginPath(); ctx.ellipse(c.x-c.s*0.5,c.y+6,c.s*0.5,c.s*0.26,0,0,7); ctx.fill(); }
  // 水
  const wat = ctx.createLinearGradient(0,waterY,0,H);
  wat.addColorStop(0,"#2e7ea8"); wat.addColorStop(1,"#134a6b");
  ctx.fillStyle=wat; ctx.fillRect(0,waterY,W,H-waterY);
  // 水面波纹
  ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const y = waterY+10 + i*(H-waterY)/6;
    ctx.beginPath();
    for(let x=0;x<=W;x+=6){ const yy = y + Math.sin(x*0.02 + animT*1.2 + i)*3; x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy); }
    ctx.stroke();
  }
  // 水下游鱼
  for(const f of fishS){
    ctx.save(); ctx.translate(f.x,f.y); if(f.dir<0) ctx.scale(-1,1);
    ctx.fillStyle=f.c; ctx.beginPath(); ctx.ellipse(0,0,f.r*1.6,f.r,0,0,7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(f.r*1.2,-f.r*0.8); ctx.lineTo(f.r*2.6,0); ctx.lineTo(f.r*1.2,f.r*0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // 码头
  ctx.fillStyle="#6b4a2f";
  ctx.fillRect(W*0.42, waterY-8, W*0.16, H-waterY);
  ctx.fillStyle="#7d5636";
  for(let i=0;i<4;i++) ctx.fillRect(W*0.42+i*(W*0.16/4), waterY-20, 3, 14);
  // 钓竿（从玩家到浮漂）
  if(phase!=="idle"){
    ctx.strokeStyle="#3a2b1c"; ctx.lineWidth=5; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(rod.x,rod.y); ctx.quadraticCurveTo((rod.x+bobber.x)/2, rod.y-140, bobber.x, bobber.y); ctx.stroke();
    ctx.strokeStyle="#c98a4b"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rod.x,rod.y); ctx.quadraticCurveTo((rod.x+bobber.x)/2, rod.y-140, bobber.x, bobber.y); ctx.stroke();
    // 浮漂
    ctx.fillStyle = (phase==="bite") ? "#ff4d4d" : (phase==="reel" ? "#ffd76a" : "#ff6a3c");
    ctx.beginPath(); ctx.arc(bobber.x, bobber.y, phase==="bite" ? 7+Math.sin(animT*20)*2 : 5, 0, 7); ctx.fill();
    ctx.fillStyle="#eee"; ctx.beginPath(); ctx.arc(bobber.x, bobber.y-3, 2.5, 0, 7); ctx.fill();
    // 咬钩波纹
    if(phase==="bite"){
      ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2;
      for(let i=0;i<2;i++){ const rr=10+i*8+((animT*30+i*20)%16); ctx.beginPath(); ctx.arc(bobber.x,bobber.y,rr,0,7); ctx.stroke(); }
    }
  } else {
    // idle：竿静立
    ctx.strokeStyle="#3a2b1c"; ctx.lineWidth=5; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(rod.x,rod.y); ctx.quadraticCurveTo(rod.x+30, rod.y-90, rod.x-10, rod.y-120); ctx.stroke();
    ctx.strokeStyle="#c98a4b"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(rod.x,rod.y); ctx.quadraticCurveTo(rod.x+30, rod.y-90, rod.x-10, rod.y-120); ctx.stroke();
  }
  // 收杆成功提示
  if(phase==="reel" && catchResult){
    ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font="bold 16px sans-serif"; ctx.textAlign="center";
    ctx.fillText("+"+catchResult.val, bobber.x, Math.max(30,bobber.y-16));
  }
}

function frame(t){
  const dt = Math.min(0.05, (t - (frame._t||t))/1000 || 0.016);
  frame._t = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

function refreshHUD(){
  document.getElementById("hCoins").textContent = fmt(player.coins);
  document.getElementById("hScore").textContent = fmt(player.score);
  document.getElementById("hBest").textContent = fmt(player.best);
  document.getElementById("bestNum").textContent = fmt(player.best);
}
function promptBite(){
  const p = document.getElementById("prompt");
  p.classList.toggle("show", bitePrompt && phase==="bite");
}

/* ================= 输入 ================= */
let casting=false;
cvs.addEventListener("pointerdown", e=>{
  const x = e.offsetX, y = e.offsetY;
  // 点击浮漂附近 = 收杆
  if(phase==="bite" && Math.hypot(x-bobber.x, y-bobber.y) < 80){ reel(); return; }
  if(phase==="bite"){ reel(); return; }
  if(phase==="idle"){ cast(); return; }
});
window.addEventListener("keydown", e=>{
  if(e.key===" " || e.key==="Enter"){
    if(phase==="bite") reel(); else if(phase==="idle") cast();
  }
});
// 收杆按钮逻辑：任何时候点击水面/浮漂都尝试收杆
function tryReel(){ if(phase==="bite") reel(); }

/* ================= 设置 / 配置 ================= */
function openSettings(){
  document.getElementById("inpUser").value = getUser();
  document.getElementById("inpToken").value = getToken();
  document.getElementById("settingsOverlay").classList.add("open");
  updateSetNote();
}
function closeSettings(){ document.getElementById("settingsOverlay").classList.remove("open"); }
function saveConfig(){
  const u = document.getElementById("inpUser").value.trim();
  const t = document.getElementById("inpToken").value.trim();
  if(!u){ toast("请输入玩家名"); return; }
  if(!t){ toast("请输入 GitHub Token"); return; }
  localStorage.setItem(LS_USER, u);
  localStorage.setItem(LS_TOKEN, t);
  player.username = u;
  updateSetNote();
  toast("✅ 配置已保存，可立即保存存档");
}
function updateSetNote(){
  const el = document.getElementById("setNote");
  if(hasAuth()) el.innerHTML = "当前玩家：<b>" + getUser() + "</b> ｜ Token 已配置 ✓ ｜ 可自动存档";
  else el.innerHTML = "未配置 Token / 未登录";
}

/* ================= 退出确认流程 ================= */
function handleExit(){
  try{
    if(confirm("是否确定保存存档？")){
      pushSave().then(ok=>{ if(ok) doExit(); });   // 保存成功才退出；失败留在游戏可重试
    }else if(confirm("是否确定不保存？未保存的进度将丢失")){
      alert("当前存档记录将不会被保存");
      doExit();
    }
    // 二次取消：留在游戏
  }catch(e){ doExit(); }
}
function doExit(){
  // 返回游戏大厅
  window.location.href = ARCADE;
}
window.addEventListener("beforeunload", e=>{
  if(dirty && hasAuth()){
    // 浏览器可能拦截 confirm，尽力而为：有未保存进度时尝试静默补存一次
    try{
      const ok = confirm("是否确定保存存档？");
      if(ok){ e.preventDefault(); e.returnValue=""; pushSave(); }
    }catch(_){}
  }
});
window.addEventListener("pagehide", ()=>{});

/* ================= 排行榜展示切换（移动端） ================= */
function toggleLB(){ document.getElementById("leaderboard").classList.toggle("open"); }

/* ================= Toast ================= */
let toastTimer=null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ================= 启动 ================= */
async function boot(){
  // 恢复本地配置
  player.username = getUser();
  resize(); window.addEventListener("resize", resize);
  refreshHUD();
  // 从云端恢复该玩家存档（若有）
  if(hasAuth()){
    try{
      const f = await readGH(savePath(player.username));
      if(f){
        const d = JSON.parse(f.content);
        Object.assign(player, { best:d.bestScore||0, score:d.totalScore||0, coins:d.coins||0, catches:d.totalCatches||0, rare:d.rareFish||0 });
        refreshHUD();
      }
    }catch(e){}
  }
  // 加载排行榜
  refreshLB();
  // 每 20 秒轮询排行榜 = 实时
  setInterval(refreshLB, 20000);
  requestAnimationFrame(frame);
  // 每帧更新咬钩提示
  setInterval(promptBite, 80);
  updateSetNote();
}
boot();
</script>
