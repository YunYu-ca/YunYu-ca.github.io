<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>植物大战僵尸 · 杂交版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233f7a46'/%3E%3Ccircle cx='11' cy='11' r='4' fill='%23e6c93a'/%3E%3Ccircle cx='21' cy='16' r='6' fill='%2364b345'/%3E%3Ccircle cx='13' cy='22' r='4' fill='%23507fd6'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:radial-gradient(1200px 700px at 20% 0%,#234b2c,#10230f);
    color:#e8f0dc;font-family:PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100%;overflow:auto;
  }
  .wrap{width:min(920px,100%);padding:14px 12px 30px;}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
  h1{font-size:22px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:10px;}
  h1 .sub{font-size:11px;color:#9fcaa6;font-weight:400;letter-spacing:1px;}
  .hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:13px;}
  .hud b{color:#ffe66a;}
  button{
    background:#3f7a46;color:#fff;border:1px solid #5ba364;border-radius:6px;
    padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;
  }
  button:hover{background:#4b8f53;}
  button.ghost{background:transparent;color:#bcd6b0;border-color:#5a7a4f;}
  #canvas{
    width:100%;background:#0c1c0b;border-radius:12px;border:1px solid #2f5230;
    display:block;box-shadow:0 18px 50px rgba(0,0,0,.5);cursor:pointer;touch-action:none;
  }
  .tips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:11px;color:#8fb393;line-height:1.7;}
  .tips span{background:#16321a;border:1px solid #2c4a2e;border-radius:5px;padding:4px 8px;}
  .hybrid-note{background:#1d3a21;border:1px solid #3c5f3f;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;color:#c9dcc0;line-height:1.9;}
  .hybrid-note b{color:#ffe66a;}
  .muted{color:#6f9275;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>植物大战僵尸 <span class="sub">HYBRID EDITION · 杂交版</span></h1>
    <div class="hud">
      <span>阳光 <b id="sunBox">150</b></span>
      <span>波次 <b id="waveBox">0/0</b></span>
      <span id="statusBox" class="muted">准备</span>
      <button id="startBtn">开始游戏</button>
      <button id="soundBtn" class="ghost">🔇 音效</button>
    </div>
  </header>
  <canvas id="canvas" width="900" height="520"></canvas>
  <div class="hybrid-note">
    <b>杂交实验室：</b>把两种植物放到一起，就能培育出拥有双重能力的<b>杂交植物</b>。例如「向日葵 × 豌豆射手 = 阳光豌豆」（既产阳光又会开炮）。点击种子栏里的<b>杂交</b>卡片，再点两张基础植物，即可生成杂交卡。顶住一波波僵尸的进攻，全部守住就胜利！
  </div>
  <div class="tips">
    <span>点击阳光图标收集</span><span>选中植物后点击草坪种植</span><span>植物点击可铲除(返还一半)</span><span>杂交植物更强更贵</span>
  </div>
</div>

<script>
/* ===== 植物大战僵尸 · 杂交版 — 原创自包含实现 ===== */
(function(){
"use strict";
var cv=document.getElementById('canvas'), ctx=cv.getContext('2d');
var sunBox=document.getElementById('sunBox'), waveBox=document.getElementById('waveBox'),
    statusBox=document.getElementById('statusBox'),
    startBtn=document.getElementById('startBtn'), soundBtn=document.getElementById('soundBtn');

/* ===== 常量 ===== */
var ROWS=5, COLS=9;
var fieldX=150, fieldY=70, cellW=(cv.width-fieldX)/COLS, cellH=(cv.height-fieldY)/ROWS;
var state='menu'; // menu | playing | won | lost
var sun=150, wave=0, totalWaves=5, time=0, selected=null, plantCD=0;
var cells=[], plants=[], zombies=[], projectiles=[], suns=[], effects=[];
var ctxAudio=null, muted=true;

/* ===== 植物定义：基础 + 杂交 ===== */
function mk(id,name,cost,opts){ return Object.assign({id,name,cost,type:'plant'},opts); }
var BASES=[
  mk('sunflower','向日葵',50,{kind:'sun',cooldown:8,hp:150,color:'#e6c93a',role:'每8秒产50阳光'}),
  mk('peashooter','豌豆射手',100,{kind:'shoot',rate:1.4,dmg:20,hp:150,color:'#64b345',role:'向前射豌豆'}),
  mk('snowpea','寒冰射手',175,{kind:'shoot',rate:1.6,dmg:20,slow:true,hp:160,color:'#7fd0e8',role:'发射减速冰豆'}),
  mk('wallnut','坚果墙',50,{kind:'wall',hp:3000,color:'#c9a05a',role:'高血量肉盾'}),
  mk('cherry','樱桃炸弹',150,{kind:'bomb',fuse:1.0,color:'#d8493e',role:'爆炸清场'}),
  mk('potato','土豆雷',25,{kind:'mine',armTime:12,color:'#b98a4e',role:'埋雷炸僵尸'}),
  mk('threepeater','三线射手',300,{kind:'shoot3',rate:1.5,dmg:20,hp:160,color:'#7cc95a',role:'三行同时攻击'}),
  mk('gatling','机枪射手',250,{kind:'shoot',rate:0.6,dmg:20,hp:150,color:'#4d9b45',role:'超快连发'})
];
var HYBRIDS=[
  mk('sunpea','阳光豌豆',150,{kind:'hybrid',base:['sunflower','peashooter'],p1:'sun',p2:'shoot',rate:1.4,dmg:24,cooldown:8,sunAmt:25,hp:180,color:'#cfe64a',role:'射豌豆+产阳光'}),
  mk('icepea','冰霜豌豆',200,{kind:'hybrid',base:['snowpea','peashooter'],p1:'shoot',p2:'shoot',slow:true,slowAmt:0.55,rate:1.4,dmg:24,hp:170,color:'#8fd7ef',role:'强减速冰豆'}),
  mk('wallpea','坚果炮台',175,{kind:'hybrid',base:['wallnut','peashooter'],p1:'wall',p2:'shoot',rate:1.5,dmg:24,hp:1400,color:'#d8c07a',role:'坦克+开炮'}),
  mk('cherrypea','爆炸豌豆',250,{kind:'hybrid',base:['cherry','peashooter'],p1:'shoot',p2:'shoot',rate:1.2,dmg:22,bombCd:6,color:'#e8806a',role:'射击+周期性爆炸'}),
  mk('gatlingice','寒冰加特林',350,{kind:'hybrid',base:['gatling','snowpea'],p1:'shoot',p2:'shoot',slow:true,slowAmt:0.5,rate:0.55,dmg:20,hp:170,color:'#9ad6e8',role:'超快冰豆连发'}),
  mk('potatosun','阳光地雷',75,{kind:'hybrid',base:['potato','sunflower'],p1:'sun',p2:'mine',cooldown:10,sunAmt:30,armTime:8,color:'#e8d04a',role:'产阳光+埋雷'})
];
var SEEDBANK=BASES.concat(HYBRIDS);
var plantById={}; BASES.concat(HYBRIDS).forEach(function(p){plantById[p.id]=p;});

/* ===== 僵尸定义 ===== */
function zk(id,name,hp,speed,dmg,color,rowsz){return {id,name,hp,speed,dmg,color,rowsz};}
var ZKINDS=[
  zk('norm','普通僵尸',200,0.42,40,'#7a9a5f',1),
  zk('cone','路障僵尸',520,0.36,60,'#c9a06a',1),
  zk('bucket','铁桶僵尸',1150,0.30,70,'#8f9aa0',1),
  zk('run','迅捷僵尸',150,0.85,40,'#b5a642',0.9),
  zk('giant','巨无霸僵尸',3200,0.18,120,'#5c5c5c',1.4),
  zk('flag','旗帜僵尸',250,0.42,40,'#e0564d',1)
];
var zkById={}; ZKINDS.forEach(function(z){zkById[z.id]=z;});

/* ===== 波次定义 ===== */
function spawnWave(){
  wave++;
  waveBox.textContent=wave+'/'+totalWaves;
  statusBox.textContent='第 '+wave+' 波进攻！';
  statusBox.style.color='#ff9d6a';
  var plan=buildWavePlan(wave);
  scheduleWave(plan, 900+plan.length*500);
}
function buildWavePlan(w){
  var plan=[];
  var pool=[];
  if(w>=1){pool.push('norm');}
  if(w>=2){pool.push('cone');}
  if(w>=3){pool.push('bucket','run');}
  if(w>=4){pool.push('giant','run');}
  if(w>=5){pool.push('bucket','giant','flag');}
  var count=3+w*2;
  for(var i=0;i<count;i++){
    plan.push({kind:pool[(Math.random()*pool.length)|0], at:800+i*900});
  }
  return plan;
}
function scheduleWave(plan, delay){
  var t0=time+delay/1000;
  plan.forEach(function(e){
    setTimeout(function(){
      if(state!=='playing')return;
      var row=(Math.random()*ROWS)|0;
      spawnZombie(e.kind,row);
    }, Math.max(0,(e.at+delay)-time*1000));
  });
  // 记录本波结束（用于判定胜利）
  waveEndTimes[wave]=t0+(plan[plan.length-1]?plan[plan.length-1].at:0)/1000+8;
}
var waveEndTimes={};

function spawnZombie(kind,row){
  var z=zkById[kind];
  zombies.push({
    kind:kind,row:row,x:cv.width+20,y:fieldY+row*cellH+cellH*0.66,
    hp:z.hp, maxhp:z.hp, speed:z.speed, dmg:z.dmg, color:z.color, scale:z.rowsz,
    slowUntil:0, eating:false, eatTarget:null, arm:Math.random()*3, bob:Math.random()*6
  });
}

/* ===== 游戏主循环 ===== */
var last=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(ts-last)/1000); last=ts;
  if(state==='playing') update(dt);
  draw();
}
requestAnimationFrame(function(ts){last=ts;requestAnimationFrame(loop);});

function update(dt){
  time+=dt;
  // 阳光落下
  if(Math.random()<dt*0.09) spawnSunFromSky();
  // 植物逻辑
  for(var i=plants.length-1;i>=0;i--){
    var p=plants[i]; p.cd-=dt;
    var def=plantById[p.id];
    if(def.kind==='sun'||def.p1==='sun'||def.p2==='sun'){ if(p.cd<=0){ p.cd=def.cooldown; spawnSunFromPlant(p, def.sunAmt||(def.kind==='sun'?50:25)); } }
    if((def.kind==='shoot'||def.kind==='shoot3')||def.p1==='shoot'||def.p2==='shoot'){
      if(def.bombCd){ p.bombT=(p.bombT||0)-dt; if(p.bombT<=0){ p.bombT=def.bombCd; explode(p.x,p.y,1.2,220); } }
      if(p.cd<=0){ p.cd=def.rate; shootPlant(p,def); }
    }
    if(def.kind==='mine'||def.p2==='mine'){
      p.armed=(p.armed||0)+dt;
      if(p.armed>=(def.armTime||12)) p.ready=true;
      if(p.ready){ var hit=zombieOnCell(p); if(hit){ explode(p.x,p.y,0.9,1000); killPlant(p); } }
    }
    if(def.kind==='bomb'){ p.fuseT=(p.fuseT||def.fuse||1)-dt; if(p.fuseT<=0){ explode(p.x,p.y,1.4,1600); killPlant(p); } }
    if(def.kind==='wall'||def.p1==='wall'){ /* just takes damage */ }
    if(p.hp<=0) killPlant(p);
  }
  // 僵尸
  for(var j=zombies.length-1;j>=0;j--){
    var z=zombies[j]; z.bob+=dt;
    if(z.slowUntil>time) z.effSpeed=z.speed*0.5; else z.effSpeed=z.speed;
    var eat=false, target=null;
    for(var k=0;k<plants.length;k++){ var pp=plants[k]; if(pp.row===z.row && Math.abs(pp.y-z.y)<cellH*0.8 && Math.abs(pp.x-z.x)<cellW*0.85){ eat=true; target=pp; break; } }
    z.eating=eat; z.eatTarget=target;
    if(eat&&target){ target.hp-=z.dmg*dt; if(target.hp<=0)killPlant(target); }
    else{ z.x-=z.effSpeed*60*dt; }
    if(z.x<fieldX-30){ loseGame(); return; }
    if(z.hp<=0) zombies.splice(j,1);
  }
  // 子弹
  for(var m=projectiles.length-1;m>=0;m--){
    var b=projectiles[m]; b.x+=b.vx*dt; b.life-=dt;
    var hitz=null;
    for(var n=0;n<zombies.length;n++){ var zz=zombies[n]; if(zz.row===b.row&&zz.x-16<=b.x&&zz.x+16>=b.x&&Math.abs(zz.y-b.y)<cellH*0.8){hitz=zz;break;} }
    if(hitz){ hitz.hp-=b.dmg; if(b.slow){ hitz.slowUntil=time+(b.slowDur||4); } hitz.arm+=0; effects.push({type:'hit',x:b.x,y:hitz.y-16,t:0}); projectiles.splice(m,1); }
    else if(b.x>cv.width+40||b.life<=0) projectiles.splice(m,1);
  }
  // 阳光
  for(var s=suns.length-1;s>=0;s--){ var su=suns[s]; su.t+=dt; if(su.t> (su.fromSky?16:9)) suns.splice(s,1); }
  // 特效
  for(var f=effects.length-1;f>=0;f--){ effects[f].t+=dt; if(effects[f].t>0.6)effects.splice(f,1); }
  // 波次胜利判定
  if(wave>=1 && zombies.length===0 && wave>=totalWaves && time>waveEndTimes[wave]){ winGame(); }
}

/* ===== 行为 ===== */
function spawnSunFromSky(){ suns.push({x:fieldX+Math.random()*(cv.width-fieldX-40),y:-10,t:0,amt:25,fromSky:true}); }
function spawnSunFromPlant(p,amt){ suns.push({x:p.x,y:p.y-10,t:0,amt:amt||25,fromSky:false}); }
function zombieOnCell(p){ for(var i=0;i<zombies.length;i++){ var z=zombies[i]; if(z.row===p.row&&Math.abs(z.y-p.y)<cellH*0.8&&z.x>p.x-30&&z.x<p.x+cellW*0.9)return z;} return null; }
function shootPlant(p,def){
  var rows=[];
  if(def.kind==='shoot3'){ rows=[Math.max(0,p.row-1),p.row,Math.min(ROWS-1,p.row+1)]; }
  else rows=[p.row];
  var speed=def.kind==='gatling'?0:0; // all same visual
  rows.forEach(function(r){
    projectiles.push({row:r,x:p.x+20,y:fieldY+r*cellH+cellH*0.55,vx:380,dmg:def.dmg||20,slow:!!def.slow,slowDur:def.slowAmt?def.slowAmt*6:4,life:6,color:def.slow?'#bfe9ff':'#e0f0d0'});
  });
  ctxAudio&&sfx('shoot');
}
function explode(x,y,r,dmg){
  effects.push({type:'boom',x:x,y:y,r:r,t:0});
  ctxAudio&&sfx('boom');
  for(var i=zombies.length-1;i>=0;i--){ var z=zombies[i]; if(Math.abs(z.x-x)<r*cellW&&Math.abs(z.y-y)<r*cellH*0.9){ z.hp-=dmg; } }
}
function killPlant(p){ var i=plants.indexOf(p); if(i>=0)plants.splice(i,1); }
function loseGame(){ state='lost'; statusBox.textContent='僵尸攻破防线…'; statusBox.style.color='#ff6a6a'; startBtn.textContent='重新挑战'; }
function winGame(){ state='won'; statusBox.textContent='全部守住，胜利！'; statusBox.style.color='#ffe66a'; startBtn.textContent='再来一局'; }

/* ===== 交互 ===== */
cv.addEventListener('click', function(e){
  var rect=cv.getBoundingClientRect();
  var mx=(e.clientX-rect.left)*(cv.width/rect.width), my=(e.clientY-rect.top)*(cv.height/rect.height);
  if(state==='menu'||state==='won'||state==='lost') return;
  // 收集阳光
  for(var i=suns.length-1;i>=0;i--){ var su=suns[i]; if(Math.abs(su.x-mx)<20&&Math.abs(su.y-my)<20){ sun+=su.amt; suns.splice(i,1); sfx('sun'); updateSun(); return; } }
  if(mx<fieldX||my<fieldY) return;
  var col=Math.floor((mx-fieldX)/cellW), row=Math.floor((my-fieldY)/cellH);
  if(col<0||col>=COLS||row<0||row>=ROWS)return;
  var cellX=fieldX+col*cellW+cellW/2, cellY=fieldY+row*cellH+cellH/2;
  var existing=plants.find(function(p){return p.row===row&&Math.abs(p.x-cellX)<cellW*0.5;});
  if(selected){
    var def=plantById[selected];
    if(sun<def.cost){ flash('阳光不足'); return; }
    if(existing){ flash('该格已有植物'); return; }
    sun-=def.cost; updateSun();
    plants.push({id:selected,row:row,x:cellX,y:cellY,hp:def.hp,cd:0,armed:0});
    sfx('plant');
    selected=null;
  } else if(existing){
    // 铲除
    if(existing.hp>0 && existing.cdT<0){
      var d=plantById[existing.id]; sun+=Math.floor(d.cost*0.5); updateSun(); killPlant(existing); sfx('dig');
    }
  }
});
// 点击选中格子（移动端 touch）
cv.addEventListener('touchstart',function(e){ var t=e.touches[0]; var rect=cv.getBoundingClientRect(); var mx=(t.clientX-rect.left)*(cv.width/rect.width),my=(t.clientY-rect.top)*(cv.height/rect.height); collectOrNothing(mx,my); },{passive:true});

function collectOrNothing(mx,my){ for(var i=suns.length-1;i>=0;i--){ var su=suns[i]; if(Math.abs(su.x-mx)<20&&Math.abs(su.y-my)<20){ sun+=su.amt; suns.splice(i,1); sfx('sun'); updateSun(); return; } } }

startBtn.addEventListener('click', function(){
  if(state==='playing')return;
  startGame();
});
function startGame(){
  state='playing'; wave=0; sun=150; time=0;
  plants=[]; zombies=[]; projectiles=[]; suns=[]; effects=[]; waveEndTimes={};
  selected=null; updateSun();
  spawnWave();
  startBtn.textContent='对战中';
}
soundBtn.addEventListener('click',function(){ muted=!muted; soundBtn.textContent=muted?'🔇 音效':'🔊 音效'; if(!muted)initAudio(); });

function updateSun(){ sunBox.textContent=sun; }

/* 简易音效（Web Audio，默认静音，需用户开启） */
function initAudio(){
  if(ctxAudio)return;
  try{ ctxAudio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function sfx(kind){
  if(!ctxAudio||muted)return;
  try{
    var o=ctxAudio.createOscillator(),g=ctxAudio.createGain();
    o.connect(g);g.connect(ctxAudio.destination);
    var f=kind==='shoot'?520:kind==='sun'?880:kind==='plant'?340:kind==='boom'?90:260;
    o.frequency.value=f; g.gain.setValueAtTime(0.15,ctxAudio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctxAudio.currentTime+0.15);
    o.start(); o.stop(ctxAudio.currentTime+0.15);
  }catch(e){}
}

/* ===== 绘制 ===== */
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // 天空/背景
  var g=ctx.createLinearGradient(0,0,0,cv.height); g.addColorStop(0,'#9fd0a8'); g.addColorStop(1,'#5d9b68');
  ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
  // 房子
  drawHouse();
  // 草坪格
  for(var r=0;r<ROWS;r++){ for(var c=0;c<COLS;c++){ var x=fieldX+c*cellW,y=fieldY+r*cellH; ctx.fillStyle=(r+c)%2===0?'#79b06a':'#6ea360'; ctx.fillRect(x,y,cellW,cellH); ctx.strokeStyle='rgba(0,0,0,.05)'; ctx.strokeRect(x,y,cellW,cellH); } }
  // 顶栏
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(fieldX,10,cellW*COLS,44);
  ctx.fillStyle='#ffe66a'; ctx.font='16px sans-serif'; ctx.textAlign='center';
  ctx.fillText('🌻 杂交版 保卫家园', cv.width/2, 38);
  // 植物
  plants.forEach(function(p){ drawPlant(p); });
  // 阳光
  suns.forEach(function(su){ drawSun(su); });
  // 子弹
  projectiles.forEach(function(b){ ctx.beginPath(); ctx.arc(b.x,b.y,4,0,7); ctx.fillStyle=b.color; ctx.fill(); });
  // 僵尸
  zombies.forEach(function(z){ drawZombie(z); });
  // 特效
  effects.forEach(function(f){ drawEffect(f); });
  // 选中格高亮
  if(selected){ ctx.strokeStyle='#ffe66a'; ctx.lineWidth=2; ctx.strokeRect(fieldX,10,cellW*COLS,44); }
  // 菜单
  if(state==='menu'){ drawOverlay('植物大战僵尸 · 杂交版','点击「开始游戏」，培育杂交植物，守住家园！'); }
  if(state==='won'){ drawOverlay('胜利！','你守住了所有波次，家园安全了！'); }
  if(state==='lost'){ drawOverlay('失败…','僵尸攻破了防线。点击「重新挑战」再试一次！'); }
}
function drawHouse(){
  ctx.fillStyle='#8a6d4a'; ctx.fillRect(0,0,fieldX-10,cv.height);
  ctx.fillStyle='#a98c5f'; ctx.fillRect(0,0,fieldX-10,40);
  ctx.fillStyle='#7a5f3e'; for(var i=0;i<4;i++){ ctx.fillRect(18+i*30,80,16,26); }
  ctx.fillStyle='#c7a05a'; ctx.fillRect(fieldX-16,0,6,cv.height);
}
function drawPlant(p){
  var def=plantById[p.id];
  var s=1.1;
  var bob=p.hp>0? Math.sin(p.bob||0)*2:0;
  // 身体
  ctx.save(); ctx.translate(p.x,p.y+bob);
  ctx.beginPath(); ctx.arc(0,0,16*s,0,7); ctx.fillStyle=def.color; ctx.fill(); ctx.strokeStyle='rgba(0,0,0,.25)'; ctx.lineWidth=1.5; ctx.stroke();
  // 茎叶
  ctx.fillStyle='#4a9b42'; ctx.beginPath(); ctx.ellipse(0,10,9,6,0,0,7); ctx.fill();
  // 眼睛
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-5,-4,4,0,7); ctx.arc(6,-4,4,0,7); ctx.fill();
  ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(-4,-4,1.8,0,7); ctx.arc(7,-4,1.8,0,7); ctx.fill();
  // 杂交标记
  if(def.kind==='hybrid'){ ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center'; ctx.fillText('H',0,-24); }
  // 血条(墙体)
  if(def.kind==='wall'||def.p1==='wall'){ drawHP(p,def); }
  if(p.armed){} if(p.ready){ ctx.fillStyle='#ff6a6a'; ctx.beginPath(); ctx.arc(0,-20,4,0,7); ctx.fill(); }
  ctx.restore();
}
function drawHP(p,def){ var w=30,h=4; var ratio=Math.max(0,p.hp/def.hp); ctx.fillStyle='#000'; ctx.fillRect(p.x-w/2,p.y-26,w,h); ctx.fillStyle=ratio>0.5?'#5dd15d':ratio>0.25?'#ffd24d':'#ff6a6a'; ctx.fillRect(p.x-w/2,p.y-26,w*ratio,h); }
function drawSun(su){
  ctx.save(); ctx.globalAlpha=Math.max(0,1-(su.t/(su.fromSky?16:9))); ctx.translate(su.x,su.y);
  ctx.fillStyle='#ffe66a'; ctx.beginPath(); ctx.arc(0,0,12,0,7); ctx.fill();
  ctx.fillStyle='#ffd54d'; for(var i=0;i<8;i++){ var a=i*Math.PI/4; ctx.beginPath(); ctx.moveTo(Math.cos(a)*16,Math.sin(a)*16); ctx.lineTo(Math.cos(a)*22,Math.sin(a)*22); ctx.lineWidth=2.5; ctx.strokeStyle='#ffd54d'; ctx.stroke(); }
  ctx.fillStyle='#333'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('+'+su.amt,0,3);
  ctx.restore();
}
function drawZombie(z){
  var x=z.x, y=z.y;
  ctx.save(); ctx.translate(x,y);
  var bob=Math.sin(z.bob)*3;
  ctx.fillStyle=z.color; ctx.beginPath(); ctx.arc(0,-14*z.scale,11*z.scale,0,7); ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.3)'; ctx.stroke();
  // 身体
  ctx.fillStyle='#6a7a5a'; ctx.fillRect(-9*z.scale,4*z.scale,18*z.scale,20*z.scale);
  ctx.fillStyle='#3a4a30'; ctx.fillRect(-9*z.scale,20*z.scale,18*z.scale,8*z.scale);
  // 手臂（往前伸）
  ctx.strokeStyle='#6a7a5a'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(8*z.scale,8*z.scale); ctx.lineTo(22*z.scale,10*z.scale+bob); ctx.stroke();
  // 眼睛
  ctx.fillStyle='#f2d53a'; ctx.beginPath(); ctx.arc(-4,-16*z.scale,3,0,7); ctx.arc(5,-16*z.scale,3,0,7); ctx.fill();
  ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(-3,-16*z.scale,1.5,0,7); ctx.arc(6,-16*z.scale,1.5,0,7); ctx.fill();
  // 血条
  var w=26,h=4; var ratio=Math.max(0,z.hp/z.maxhp); ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(-w/2,-30,w,h); ctx.fillStyle=ratio>0.5?'#5dd15d':ratio>0.25?'#ffd24d':'#ff6a6a'; ctx.fillRect(-w/2,-30,w*ratio,h);
  ctx.restore();
}
function drawEffect(f){
  if(f.type==='hit'){ ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillText('✳',f.x,f.y); }
  if(f.type==='boom'){ ctx.globalAlpha=Math.max(0,1-f.t/0.6); ctx.fillStyle='rgba(255,140,50,.7)'; ctx.beginPath(); ctx.arc(f.x,f.y,20+f.t*120,0,7); ctx.fill(); ctx.globalAlpha=1; }
}
function drawOverlay(title,sub){
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='bold 30px sans-serif'; ctx.fillText(title,cv.width/2,cv.height/2-16);
  ctx.font='15px sans-serif'; ctx.fillStyle='#ddebd0'; ctx.fillText(sub,cv.width/2,cv.height/2+22);
}
function flash(msg){ statusBox.textContent=msg; statusBox.style.color='#ff9d6a'; setTimeout(function(){statusBox.textContent=state==='playing'?('第 '+wave+' 波进攻'):statusBox.textContent;},1200); }
updateSun();
})();
</script>
