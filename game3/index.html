        if(opts.forceModify){ mode='modify'; title.textContent='⚙️ 修改云配置（需管理员密码）'; sub.textContent='可修改 token 和/或管理员密码，改完同步所有设备'; tokWrap.style.display='block'; newpwWrap.style.display='block'; }
        else if(ls(TK)){ // 本机已解锁 → 提供修改入口
          mode='modify'; title.textContent='⚙️ 修改云配置（需管理员密码）'; sub.textContent='输入管理员密码可修改 token / 密码'; tokWrap.style.display='block'; newpwWrap.style.display='block';
        } else { mode='unlock'; title.textContent='🔓 云存档解锁'; sub.textContent='配置已存在。输入管理员密码解锁（本机只需一次）'; }
      } else {
        mode='setup'; title.textContent='⚙️ 首次配置云存档'; sub.textContent='设置管理员密码 + GitHub Token，加密写入仓库，所有设备自动同步'; pw.placeholder='设置管理员密码（至少4位）'; tokWrap.style.display='block';
      }
      var sv=d.querySelector('#hub-save');
      sv.onclick=null;
      sv.onclick=async function(){
        try{
          if(mode==='setup'){ show('正在写入仓库…','#e2e8f0'); var r=await setup(pw.value, tk.value); show(r.message,'#4ade80'); if(r.ok) setTimeout(function(){d.remove();},1300); }
          else if(mode==='unlock'){ show('正在解密…','#e2e8f0'); var r2=await unlock(pw.value); show(r2.message,'#4ade80'); if(r2.ok) setTimeout(function(){d.remove();},1300); }
          else if(mode==='modify'){ show('正在更新并同步…','#e2e8f0'); var r3=await modify(pw.value, tk.value, npw.value); show(r3.message,'#4ade80'); if(r3.ok) setTimeout(function(){d.remove();},1300); }
        }catch(e){ show(e.message||'失败','#f87171'); }
      };
    }).catch(function(e){ show(e.message||'连接仓库失败','#f87171'); });
  }

  /* 启动：本机无 token 则拉仓库配置决定 unlock/setup */
  function ensure(){
    if(ls(TK)) return;
    fetchCfg().then(function(cfg){
      if(cfg && !ls(TK)) open({forceModify:false}); // 有配置未解锁 → 解锁框
      else if(!cfg) open({forceModify:false});      // 无配置 → 首次配置框
    }).catch(function(){ /* 拉取失败不打扰，玩家仍可点 ⚙️ */ });
  }

  window.__HubAdmin={ getToken:getToken, isSet:isSet, open:open, ensure:ensure, unlock:unlock, setup:setup, modify:modify, fetchCfg:fetchCfg };
})();


</script>
